<!doctype html>

    see licenses/MENGTO-SKILLS-MIT.txt:
      - `build-wireframe-scan-reveal` — the paired wire cage and surface
        sharing one expanding world-space front, and its landed timings.

      - `threejs-landscape` — the instanced-ribbon grass technique: all
        bend, wind and taper computed in the vertex shader.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Dataland</title>
<meta name="description" content="Atlas is the internal operating system of Dataland — reports, files, identity, and chat for the studio.">
<meta name="theme-color" content="#05060a">
<style>
  /* ---------- fonts (vendored, OFL 1.1 — see licenses/GEIST-OFL.txt) ---------- */
  @font-face {
    font-family: "Geist";
    src: url("assets/geist-sans-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("assets/geist-mono-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  /* ---------- tokens ---------- */
  :root {
    /* Night. The page is near-black so the scene's bioluminescence is the
       only light in the room, the way the reference installation works. */
    --ground: #05060a;
    --void: #05060a;
    --bone: #ededef;
    --mist: #8f909a;
    --hairline: rgba(237, 237, 239, 0.14);
    --hairline-quiet: rgba(237, 237, 239, 0.08);
    --card: rgba(8, 9, 14, 0.88);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --font-sans: "Geist", system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }
  body {
    min-height: 100dvh;
    background: var(--ground);
    color: var(--bone);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow-x: hidden;
  }

  ::selection { background: rgba(255, 79, 160, 0.35); }

  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--bone);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------- canvas / fallback ground ---------- */
  #field {
    position: fixed;
    inset: 0;
    /* Explicit, not left to `auto`. A canvas with auto width falls back to its
       `width` attribute — the drawing buffer — so the element's layout size
       would follow the buffer we are about to set from it, and the
       ResizeObserver below would feed itself. Pinning it to the viewport keeps
       the painted box the single source of truth for the renderer. */
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    opacity: 0;
    transition: opacity 1600ms ease;
  }
  body.gl-ready #field { opacity: 1; }
  /* before GL is up (and forever, if it never comes up) faint pools of
     bioluminescent colour keep the night from being a dead black hole */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(46% 56% at 66% 50%, rgba(74, 92, 255, 0.10), transparent 70%),
      radial-gradient(36% 46% at 28% 80%, rgba(55, 182, 255, 0.07), transparent 70%),
      radial-gradient(30% 40% at 80% 74%, rgba(255, 79, 160, 0.06), transparent 70%),
      var(--ground);
  }

  /* ---------- chrome ---------- */
  .nav, .foot { position: relative; z-index: 2; }

  .nav {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 4vw, 48px);
    border-bottom: 1px solid var(--hairline-quiet);
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .brand i {
    width: 7px; height: 7px;
    background: var(--bone);
    display: inline-block;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 13px;
    color: var(--mist);
    transition: color 160ms;
  }
  .nav-links a:hover { color: var(--bone); }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    padding: clamp(32px, 6vh, 80px) clamp(20px, 4vw, 48px);
  }
  .hero-inner { width: min(1200px, 100%); margin: 0 auto; }
  .hero-copy { max-width: 560px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
  }

  h1 {
    margin: 18px 0 14px;
    font-size: clamp(64px, 11vw, 128px);
    font-weight: 550;
    letter-spacing: -0.045em;
    line-height: 0.95;
  }

  .lede {
    font-size: 15px;
    color: var(--mist);
    max-width: 42ch;
  }
  .lede strong { color: var(--bone); font-weight: 500; }

  /* ---------- sign in ---------- */
  .gate {
    margin-top: 40px;
    max-width: 380px;
    border: 1px solid var(--hairline);
    /* solid, no backdrop blur: blurring a live WebGL backdrop makes some
       browsers re-rasterize the card when its paint changes (e.g. on input
       focus), which reads as the whole form blinking out and back */
    background: var(--card);
    padding: 22px 22px 18px;
  }
  .gate-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
    display: block;
  }
  .gate input[type="email"] {
    width: 100%;
    margin-top: 12px;
    padding: 9px 2px 10px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    caret-color: var(--bone);
    transition: border-color 160ms;
  }
  .gate input[type="email"]::placeholder { color: rgba(237, 237, 239, 0.35); }
  .gate input[type="email"]:focus {
    outline: none;
    border-bottom-color: var(--bone);
  }
  .gate button {
    margin-top: 18px;
    width: 100%;
    padding: 11px 16px;
    background: var(--bone);
    color: var(--void);
    border: 0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 160ms;
  }
  .gate button:hover { background: #ffffff; }
  .gate button .arrow { transition: transform 200ms var(--ease-out-expo); }
  .gate button:hover .arrow { transform: translateX(3px); }
  .gate-meta {
    margin-top: 14px;
    font-size: 12px;
    color: var(--mist);
  }

  /* ---------- footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 clamp(20px, 4vw, 48px);
    height: 52px;
    border-top: 1px solid var(--hairline-quiet);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--mist);
    white-space: nowrap;
  }
  .foot .services { display: flex; gap: 18px; text-transform: uppercase; }
  .foot .telemetry { text-transform: uppercase; }

  /* ---------- entrance ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  .rise {
    animation: rise 700ms var(--ease-out-expo) both;
    animation-delay: calc(var(--i, 0) * 90ms);
  }

  /* ---------- word-level entrance ----------
     Adapted from MengTo/Skills `staggered-word-reveal` (MIT). The stagger is
     pure CSS — the index rides on a custom property, so nothing runs per
     frame while the WebGL scan is already using the budget. */
  @keyframes wordIn {
    from { opacity: 0; transform: translate3d(0, 16px, 0); }
    to   { opacity: 1; transform: none; }
  }
  /* A keyframe animation, not a transition flipped by a class. A transition
     needs something to change the start state, and the obvious trigger — a
     nested requestAnimationFrame — never fires in a background tab, which
     leaves the copy invisible until the tab is focused. An animation with
     `both` runs the moment the element exists and needs no trigger at all. */
  .word {
    display: inline-block;
    animation: wordIn 800ms var(--ease-out-expo) both;
    animation-delay: calc(var(--wd, 0ms) + var(--wi, 0) * 45ms);
    will-change: opacity, transform;
  }

  /* Stamped by script ~2.6s after load, when every entrance delay+duration
     has run out. From then on the animations are simply gone, so nothing —
     password-manager DOM churn around the sign-in form included — can replay
     them from their opacity-0 start and blink the card out. */
  html.entrance-done .rise,
  html.entrance-done .word {
    animation: none;
    opacity: 1;
    transform: none;
    filter: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
    #field { transition: none; }
    .gate button .arrow { transition: none; }
    .word { animation: none; }
  }

  /* ---------- narrow ---------- */
  @media (max-width: 720px) {
    /* the night scene IS the page — dimming it to 0.6 killed the glow */
    body.gl-ready #field { opacity: 0.92; }
    .nav-links { gap: 20px; }
    .hero { align-items: flex-start; padding-top: 8vh; }
    .gate { max-width: none; }
    .foot { font-size: 10px; justify-content: center; }
    .foot .services { gap: 14px; }
    /* the full telemetry line cannot fit a phone; the services row carries
       the footer alone */
    .foot .telemetry { display: none; }
  }
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<header class="nav">
  <a class="brand rise" style="--i: 0" href="/" aria-label="Dataland home"><i aria-hidden="true"></i>DATALAND</a>
  <nav class="nav-links rise" style="--i: 1" aria-label="Primary">
    <a href="https://github.com/dataland-atlas">Docs</a>
    <a href="#email" id="nav-signin">Sign in</a>
  </nav>
</header>

<main class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="eyebrow" data-words style="--wd: 220ms">Dataland — internal platform</p>
      <h1 class="rise" style="--i: 3">Atlas</h1>
      <p class="lede" data-words style="--wd: 620ms">
        The operating system behind the studio&rsquo;s work —
        <strong>reports, files, identity, and chat</strong> in one place.
      </p>

      <form class="gate rise" style="--i: 5" id="gate" novalidate>
        <label class="gate-label" for="email">Sign in</label>
        <input type="email" id="email" name="email" placeholder="you@dataland.team"
               autocomplete="email" spellcheck="false" required>
        <button type="submit">Continue <span class="arrow" aria-hidden="true">&rarr;</span></button>
        <p class="gate-meta">Access is provisioned by your workspace admin.</p>
      </form>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="services rise" style="--i: 6">
    <span>Reports</span><span>Files</span><span>IAM</span><span>Chat</span>
  </div>
  <div class="telemetry rise" style="--i: 7" aria-hidden="true">
    <span class="seed">seed A71A5 · </span><span id="telemetry">&nbsp;</span>
  </div>
</footer>

<script type="module">
import * as THREE from "./assets/three.module.min.js";

/* Where "Continue" goes until IAM wiring lands. */
const APP_URL = "https://atlas.dataland.team";

const form = document.getElementById("gate");
const email = document.getElementById("email");
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = email.value.trim();
  if (!email.checkValidity() || !v) { email.reportValidity?.(); email.focus(); return; }
  window.location.href = `${APP_URL}/?email=${encodeURIComponent(v)}`;
});
document.getElementById("nav-signin").addEventListener("click", (e) => {
  e.preventDefault();
  email.focus({ preventScroll: false });
  email.scrollIntoView({ behavior: "smooth", block: "center" });
});

/* ------------------------------------------------------------------ *
 *  Word-level entrance — the DOM half of the load.
 *  Adapted from MengTo/Skills `staggered-word-reveal` (MIT). The
 *  published splitter reassigns element.textContent, which would
 *  flatten the <strong> inside the lede; this one walks child nodes so
 *  inline markup survives the split.
 * ------------------------------------------------------------------ */
function splitWords(el) {
  if (el.dataset.wordsReady === "true") return;
  let i = 0;
  (function walk(node) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.TEXT_NODE) {
        const frag = document.createDocumentFragment();
        for (const part of child.nodeValue.split(/(\s+)/)) {
          if (!part) continue;
          if (!part.trim()) { frag.appendChild(document.createTextNode(part)); continue; }
          const w = document.createElement("span");
          w.className = "word";
          w.style.setProperty("--wi", i++);
          w.textContent = part;
          frag.appendChild(w);
        }
        child.replaceWith(frag);
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        walk(child);
      }
    }
  })(el);
  el.dataset.wordsReady = "true";
}

for (const el of document.querySelectorAll("[data-words]")) splitWords(el);

/* Entrance animations replay from their opacity-0 start whenever the DOM
   around them is churned — and password managers churn the DOM around a
   sign-in form the moment its input takes focus, which blinked the whole
   card out and back. A timer beats event listening here: animationend can be
   missed entirely under tab throttling, while this fires regardless and the
   stylesheet does the rest. */
setTimeout(() => document.documentElement.classList.add("entrance-done"), 2600);

/* ------------------------------------------------------------------ *
 *  The synapse tree.
 *  A deterministic branching skeleton is grown once on the CPU; the
 *  particles are the tree's flesh (dense at the trunk, sparse pigment
 *  at the tips), branch tips become synapse nodes, and near tips are
 *  linked by lines that carry travelling light pulses. The pointer
 *  parts the particles and makes the nearby synapses fire brighter.
 * ------------------------------------------------------------------ */

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("field");

/* Deterministic PRNG — the same tree grows on every load. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* shared shader chunks */
const NOISE_GLSL = /* glsl */`
  float hash(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float vnoise(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    vec3 u = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash(i), hash(i + vec3(1,0,0)), u.x),
          mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), u.x), u.y),
      mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), u.x),
          mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), u.x), u.y),
      u.z);
  }
  float fbm(vec3 p) {
    return 0.55 * vnoise(p) + 0.30 * vnoise(p * 2.13) + 0.15 * vnoise(p * 4.71);
  }
`;

function start() {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: "high-performance" });
  } catch { return; }

  const dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);

  const narrow = matchMedia("(max-width: 720px)").matches;
  /* The arch spans roughly four times the old tree's extent, so the same count
     spread over its surface reads as sparse dots rather than a mass. Coverage
     is bought back with count and point size together — size is the cheaper
     half, since the fragment shader discards almost immediately. */
  const COUNT = narrow ? 110000 : 340000;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 40);
  camera.position.set(0, 0, 4.6);

  const rand = mulberry32(0xa71a5);

  /* ---------------- grow the skeleton ---------------- */
  /* A single enormous limb enters off-frame at the lower left, arches across
     the whole viewport and plunges off the bottom right. Small offshoots
     sprout from its upper side. Everything downstream — the particle shell,
     the wire cage, the synapses — is derived from these two structures. */
  const segs = [];            // {ax..bz, r, depth, len} — for particle placement
  const branches = [];        // {pts, radii, depth} — polylines for the cage
  const tips = [];
  const MAX_SEGS = 5200;

  /* Sweep a Catmull-Rom spine through the control points and sample it into
     segments. `radii` is a coarse profile read piecewise-linearly along t, so
     the limb can stay fat through the crest and thicken again as it descends. */
  function limb(ctrl, radii, samples, depth) {
    const curve = new THREE.CatmullRomCurve3(
      ctrl.map((p) => new THREE.Vector3(p[0], p[1], p[2])), false, "centripetal", 0.5);
    const pts = [], rs = [];
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const p = curve.getPoint(t);
      pts.push([p.x, p.y, p.z]);
      const f = t * (radii.length - 1);
      const i0 = Math.min(radii.length - 2, Math.floor(f)), k = f - i0;
      rs.push(radii[i0] * (1 - k) + radii[i0 + 1] * k);
    }
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      segs.push({ ax: a[0], ay: a[1], az: a[2], bx: b[0], by: b[1], bz: b[2],
                  r: (rs[i - 1] + rs[i]) * 0.5, depth,
                  len: Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) });
    }
    branches.push({ pts, radii: rs, depth });
    return curve;
  }

  function branch(px, py, pz, dx, dy, dz, len, depth, baseR) {
    if (segs.length > MAX_SEGS) return;
    const steps = 6;
    const pts = [[px, py, pz]];
    const rs = [baseR];
    for (let i = 0; i < steps; i++) {
      dx += (rand() - 0.5) * 0.36;
      dy += (rand() - 0.5) * 0.22 + 0.04;
      dz += (rand() - 0.5) * 0.36;
      const il = 1 / Math.hypot(dx, dy, dz); dx *= il; dy *= il; dz *= il;
      const s = len / steps;
      const qx = px + dx * s, qy = py + dy * s, qz = pz + dz * s;
      const r = baseR * (1 - 0.72 * ((i + 1) / steps));
      segs.push({ ax: px, ay: py, az: pz, bx: qx, by: qy, bz: qz, r, depth, len: s });
      px = qx; py = qy; pz = qz;
      pts.push([px, py, pz]); rs.push(r);
      if (depth < 3 && i >= 1 && rand() < 0.45) {
        let cx = dx + (rand() - 0.5) * 1.8;
        let cy = dy + (rand() - 0.35) * 1.15;
        let cz = dz + (rand() - 0.5) * 1.8;
        const cl = 1 / Math.hypot(cx, cy, cz);
        branch(px, py, pz, cx * cl, cy * cl, cz * cl, len * 0.64, depth + 1, r * 0.78);
      }
    }
    branches.push({ pts, radii: rs, depth });
    if (depth >= 1) tips.push([px, py, pz]);
  }

  /* The arch. The middle eight control points are the composition; the first
     and last are long tails run well past any frame so the limb never shows a
     cut end, however wide the display is or how far the scale is pulled back.
     They cost a little sampling budget off-screen, which is cheaper than a
     layout that has to grow the limb just to hide its own caps. */
  const spine = limb(
    [[-9.4, -3.60, -1.10],
     [-6.6, -2.60, -0.70], [-4.8, -1.85, -0.30], [-3.1, -1.42, 0.05],
     [-1.4, -1.18, 0.25], [ 0.3, -0.92, 0.20], [ 1.7, -0.58, 0.05],
     [ 2.7, -0.30, -0.15], [ 3.5, -0.85, -0.35], [ 4.0, -2.00, -0.55],
     [ 6.2, -4.60, -1.05]],
    [0.80, 0.72, 0.62, 0.56, 0.52, 0.48, 0.44, 0.40, 0.46, 0.58, 0.78],
    170, 0);
  /* where the crest sits along the spine, so the layout can aim the frame at
     it instead of at the group's origin */
  const CREST_LOCAL_Y = -0.30;

  /* offshoots lean off the limb's upper side */
  /* t values are shifted from the old ten-point spine: the two tails added a
     control point at each end, so every index moved one along */
  for (const [t, len, r] of [[0.35, 1.15, 0.20], [0.50, 0.95, 0.16], [0.62, 1.35, 0.24],
                             [0.71, 1.05, 0.18], [0.80, 0.80, 0.14], [0.87, 0.62, 0.12]]) {
    const p = spine.getPoint(t), tan = spine.getTangent(t);
    let dx = -tan.y * 0.6 + (rand() - 0.5) * 0.5;
    let dy = 0.85 + rand() * 0.3;
    let dz = (rand() - 0.5) * 0.9;
    const il = 1 / Math.hypot(dx, dy, dz);
    branch(p.x, p.y, p.z, dx * il, dy * il, dz * il, len, 1, r);
  }

  /* Particle budget is split between two pools rather than drawn from one
     area-weighted table. Weighting by surface area alone loses the arch: the
     offshoots are individually thin but there are hundreds of them, and their
     aggregate area drowns the one limb that is supposed to carry the frame.
     A fixed share keeps the arch dominant no matter how the twigs branch. */
  function makePicker(list) {
    const cum = new Float64Array(list.length);
    let tot = 0;
    for (let i = 0; i < list.length; i++) { tot += list[i].len * (list[i].r + 0.02); cum[i] = tot; }
    return function (u) {
      let lo = 0, hi = list.length - 1;
      const x = u * tot;
      while (lo < hi) { const mid = (lo + hi) >> 1; (cum[mid] < x) ? lo = mid + 1 : hi = mid; }
      return list[lo];
    };
  }
  const spineSegs = segs.filter((s) => s.depth === 0);
  const twigSegs = segs.filter((s) => s.depth > 0);
  const pickSpine = makePicker(spineSegs);
  const pickTwig = twigSegs.length ? makePicker(twigSegs) : pickSpine;
  const SPINE_SHARE = 0.68;
  const pickSeg = (u) => (rand() < SPINE_SHARE ? pickSpine(u) : pickTwig(u));
  const g3 = () => (rand() + rand() + rand() - 1.5) * 0.82;   // cheap gaussian

  /* A ring frame for a segment, so particles can be laid on the tube's
     surface rather than fogged around its axis. Reused across the loop —
     allocating three Vector3s per particle would cost more than the sampling. */
  const _d = new THREE.Vector3(), _u = new THREE.Vector3(), _v = new THREE.Vector3();
  const _UP = new THREE.Vector3(0, 1, 0), _ALT = new THREE.Vector3(1, 0, 0);
  function frameOf(sg) {
    _d.set(sg.bx - sg.ax, sg.by - sg.ay, sg.bz - sg.az).normalize();
    _u.crossVectors(_d, Math.abs(_d.y) < 0.9 ? _UP : _ALT).normalize();
    _v.crossVectors(_d, _u).normalize();
  }

  /* ---------------- particles: the limb's skin + drifting spores ---------------- */
  const base = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT * 4);
  const norm = new Float32Array(COUNT * 3);  // surface normal — the light needs it
  const AMBIENT = 0.14;
  const SHELL = 0.78;                        // rest fill the interior
  for (let i = 0; i < COUNT; i++) {
    const j3 = i * 3, j4 = i * 4;
    if (rand() < AMBIENT) {
      base[j3]     = (rand() - 0.5) * 11.0;
      base[j3 + 1] = (rand() - 0.5) * 5.2 - 0.5;
      base[j3 + 2] = (rand() - 0.5) * 2.6;
      seed[j4 + 1] = rand();                 // free-floating depth key
      seed[j4 + 3] = 1;                      // kind: spore (norm stays zero)
    } else {
      const sg = pickSeg(rand());
      frameOf(sg);
      const t = rand();
      const ang = rand() * Math.PI * 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const nx = _u.x * ca + _v.x * sa, ny = _u.y * ca + _v.y * sa, nz = _u.z * ca + _v.z * sa;
      /* the shell hugs the surface; the interior fills by sqrt so it does not
         bunch at the axis and read as a bright core line */
      const rr = rand() < SHELL
        ? sg.r * (1 + g3() * 0.055)
        : sg.r * Math.sqrt(rand()) * 0.96;
      base[j3]     = sg.ax + (sg.bx - sg.ax) * t + nx * rr;
      base[j3 + 1] = sg.ay + (sg.by - sg.ay) * t + ny * rr;
      base[j3 + 2] = sg.az + (sg.bz - sg.az) * t + nz * rr;
      norm[j3] = nx; norm[j3 + 1] = ny; norm[j3 + 2] = nz;
      /* tipness reads off radius, not recursion depth — the thin twigs are the
         tips whichever structure they came from */
      seed[j4 + 1] = Math.min(1, Math.max(0, 1 - sg.r / 0.62));
      seed[j4 + 3] = 0;                      // kind: limb
    }
    seed[j4]     = rand();
    seed[j4 + 2] = rand();
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(base, 3));
  geometry.setAttribute("aSeed", new THREE.BufferAttribute(seed, 4));
  geometry.setAttribute("aNorm", new THREE.BufferAttribute(norm, 3));
  geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  /* ---------------- the scan conductor ----------------
     One expanding wavefront drives the whole entrance. The wire cage rides the
     front; the particle skin materialises SCAN.lag behind it, so you read the
     topology before the surface arrives. Constants are the landed timings from
     MengTo's `build-wireframe-scan-reveal` (MIT), converted from its pixel-scale
     world to ours: the frame is ~10 units wide here against its ~1440, so each
     length is divided by about 144.
     Everything below runs in ORGANISM-LOCAL space. The group's scale changes on
     resize, and measuring locally means the front rescales with the geometry
     instead of tearing away from it. */
  const SCAN = {
    dur:   3.4,     // a faster sweep reads as a flash
    lag:   3.60,    // 520 world units there — the cage leads by a third of the frame
    edge:  0.94,    // 135 — narrower aliases, wider turns to fog
    trail: 6.60,    // 950 — without it the topology is gone before it is read
    maxR:  0,       // measured from the geometry below, not guessed
  };
  const shared = {
    uTime:            { value: 0 },
    uForm:            { value: reducedMotion ? 1 : 0 },
    uPixelRatio:      { value: dpr },
    uPointer:         { value: new THREE.Vector3(99, 99, 0) },
    uPointerStrength: { value: 0 },
    /* low and to the left, outside the silhouette — a centred origin reads as
       a loading ring rather than a survey sweeping across the form */
    uScanOrigin:      { value: new THREE.Vector3(-5.6, -2.9, 0.9) },
    uScanRadius:      { value: reducedMotion ? SCAN.maxR : 0 },
    uScanOn:          { value: reducedMotion ? 0 : 1 },
    uScanLag:         { value: SCAN.lag },
    uScanEdge:        { value: SCAN.edge },
  };

  /* How far the front actually has to travel. Measured off the skeleton rather
     than guessed from the viewport: the reach must clear the furthest point of
     the limb PLUS the lag trailing behind it, or the tail never materialises —
     while a reach that overshoots spends most of the timeline sweeping empty
     space with nothing left to reveal, which reads as the entrance stalling. */
  {
    const o = shared.uScanOrigin.value;
    let dmax = 0;
    for (const br of branches)
      for (const p of br.pts)
        dmax = Math.max(dmax, Math.hypot(p[0] - o.x, p[1] - o.y, p[2] - o.z));
    SCAN.maxR = dmax + SCAN.lag + 0.9;
    if (reducedMotion) shared.uScanRadius.value = SCAN.maxR;
  }

  /* Shared by every material that has to sit behind the front. The two long
     sine terms are what keep the edge from reading as a clip-path. */
  const SCAN_GLSL = /* glsl */`
    uniform vec3 uScanOrigin;
    uniform float uScanRadius, uScanOn, uScanLag, uScanEdge;
    float scanFront(vec3 q) {
      float wob = sin(q.y * 2.1 + q.x * 1.3) * 0.24
                + sin(q.z * 3.9 + q.y * 2.4) * 0.11;
      return uScanRadius - uScanLag + wob;
    }
    /* 1 once the surface has arrived, 0 ahead of it */
    float scanned(vec3 q, float soft) {
      if (uScanOn < 0.5) return 1.0;
      return 1.0 - smoothstep(scanFront(q) - soft, scanFront(q) + soft, distance(q, uScanOrigin));
    }
  `;
  /* Bioluminescent night spectrum, sampled from the reference: lime canopy,
     electric cyan and blue-violet structures, rare magenta blooms, warm gold
     fireflies. Everything emits; the black page is the darkness around it. */
  const palette = {
    uColorA:   { value: new THREE.Color("#4a5cff") },   // blue-violet hollows
    uColorB:   { value: new THREE.Color("#37b6ff") },   // electric cyan
    uColorHot: { value: new THREE.Color("#ffe2a8") },   // warm gold — sparks, scan front
    uColorMoss: { value: new THREE.Color("#59c93c") },  // lime canopy green
    uColorLeaf: { value: new THREE.Color("#ff4fa0") },  // magenta bloom
  };

  /* The cursor is a lantern: anything within its reach burns brighter.
     Relies on uPointer / uPointerStrength being declared by the including
     shader before this chunk is injected. */
  const GLOW_GLSL = /* glsl */`
    float lume(vec3 q) {
      return smoothstep(1.25, 0.0, distance(q, uPointer)) * uPointerStrength;
    }
  `;

  /* Bioluminescent point cloud — additive again, but deliberately this time:
     a wide multi-hue spectrum on true black rather than one lime, and the
     cursor as a roving lantern. Depth reads from hue and brightness. */
  const particleMaterial = new THREE.ShaderMaterial({
    name: "particles",
    uniforms: { ...shared, ...palette },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec4 aSeed;
      attribute vec3 aNorm;
      uniform float uTime, uForm, uPixelRatio, uPointerStrength;
      uniform vec3 uPointer, uColorA, uColorB, uColorHot, uColorMoss, uColorLeaf;
      varying vec3 vColor;
      varying float vAlpha;
      ${NOISE_GLSL}
      ${SCAN_GLSL}
      ${GLOW_GLSL}
      void main() {
        vec3 aBase = position;
        float kind = aSeed.w;                 /* 0 limb · 1 ambient */
        float tipness = aSeed.y;              /* 0 trunk · 1 outer twigs */

        /* the front condenses each particle out of the scatter as it passes.
           Ambient dust lags a little further so the limb lands first. */
        float soft = mix(0.30, 0.90, kind);
        float here = scanned(aBase, soft);
        /* a bright band just behind the front — this is what makes the sweep
           read as alive rather than as a reveal mask */
        float edge = exp(-pow((distance(aBase, uScanOrigin) - scanFront(aBase)) / uScanEdge, 2.0))
                   * uScanOn * (1.0 - kind * 0.55);

        vec3 dir = normalize(aBase + vec3(0.001, 0.002, 0.001));
        vec3 scatter = dir * (3.5 + aSeed.x * 4.5);
        vec3 p = mix(scatter, aBase, here * uForm);

        float t = uTime * 0.10;
        vec3 q = aBase * vec3(0.55, 0.85, 0.7);
        vec3 warp = vec3(
          fbm(q * 1.1 + vec3(0.0, t * 0.8, t * 0.3)),
          fbm(q * 1.1 + vec3(5.2, 1.3 - t * 0.6, t * 0.2)),
          fbm(q * 1.1 + vec3(9.7, t * 0.4, 3.1))
        ) - 0.5;
        float w = fbm(q * 1.6 + warp * 2.2 + vec3(0.0, 0.0, t));

        /* the trunk barely breathes; twigs and loose pigment drift */
        float amp = mix(0.05 + tipness * 0.24, 0.55, kind);
        vec3 flow = warp * amp * 2.0;
        flow.y += sin(aBase.x * 1.9 + uTime * 0.45 + warp.x * 4.0) * amp * 0.5;
        p += flow * uForm;

        /* The pointer no longer displaces the flesh — that response belongs to
           the grass now, which parts under the cursor like a brushed pelt. The
           shell only warms faintly where the cursor passes, so the two layers
           read as one surface reacting, not two competing effects. */
        float infl = smoothstep(1.0, 0.0, distance(p, uPointer)) * uPointerStrength
                   * mix(0.3 + 0.7 * tipness, 1.0, kind);

        /* fireflies only survive on the strongest ridges of the warped field */
        float fil = smoothstep(0.55, 0.82, w);
        float keep = mix(1.0, fil * 0.9, kind);

        /* Bioluminescent skin: hue drifts along the limb through the noise
           field — lime in the canopy, cyan on the flanks, blue-violet in the
           hollows, a rare magenta bloom where the field peaks — and upward
           faces glow hardest, like the reference's lit moss. */
        float hue = clamp(w * 1.0 + warp.x * 0.5 + tipness * 0.35 - 0.42, 0.0, 1.0);
        vec3 c = hue < 0.5 ? mix(uColorMoss, uColorB, hue * 2.0)
                           : mix(uColorB, uColorA, hue * 2.0 - 1.0);
        c = mix(c, uColorLeaf, smoothstep(0.72, 0.95, warp.y + 0.5) * 0.45);
        float sparkle = smoothstep(0.86, 0.99, vnoise(aBase * 11.0 + vec3(0.0, 0.0, uTime * 0.35)));
        c = mix(c, uColorHot, sparkle * 0.6);
        float lum = lume(p);                              /* the cursor lantern */
        c *= (0.34 + 0.85 * w) * (0.45 + 0.55 * max(aNorm.y, 0.0))
           * (1.0 + infl * 0.3 + lum * 3.2);
        c = mix(c, uColorHot, min(edge, 1.0) * 0.8);      /* the survey front */

        /* fireflies: warm gold motes adrift in the dark */
        vec3 spark = uColorHot * (0.5 + 0.5 * aSeed.z);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vColor = mix(c, spark, kind) * (1.0 - 0.45 * smoothstep(4.9, 7.2, -mv.z));
        vAlpha = (0.30 + 0.70 * aSeed.z) * keep * max(here, edge * 0.85);

        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.7 + aSeed.z * 1.9 + (sparkle + lum) * 1.5 + edge * 1.8)
                     * uPixelRatio * (3.4 / -mv.z) * mix(1.0, 0.55, kind)
                     /* matter still in flight is fine dust; it swells as it lands */
                     * mix(0.5, 1.0, here);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.14, d) * vAlpha;
        if (a < 0.012) discard;
        gl_FragColor = vec4(vColor * a, a);
      }
    `,
  });
  const points = new THREE.Points(geometry, particleMaterial);

  /* ---------------- synapses: tips linked to their neighbours ---------------- */
  const linkPos = [];
  const linkT = [];
  const linkInfo = [];
  let links = 0;
  const MAXD2 = 1.15 * 1.15;   /* the offshoots sit further apart on the arch */
  for (let i = 0; i < tips.length; i++) {
    let n1 = -1, n2 = -1, d1 = MAXD2, d2 = MAXD2;
    for (let j = 0; j < tips.length; j++) {
      if (j === i) continue;
      const dx = tips[i][0] - tips[j][0], dy = tips[i][1] - tips[j][1], dz = tips[i][2] - tips[j][2];
      const dd = dx * dx + dy * dy + dz * dz;
      if (dd < d1) { d2 = d1; n2 = n1; d1 = dd; n1 = j; }
      else if (dd < d2) { d2 = dd; n2 = j; }
    }
    for (const n of [n1, n2]) {
      if (n < 0 || n < i) continue;          // n < i already considered the pair
      const ph = rand(), sp = rand();
      linkPos.push(...tips[i], ...tips[n]);
      linkT.push(0, 1);
      linkInfo.push(ph, sp, ph, sp);
      links++;
    }
  }
  const linkGeometry = new THREE.BufferGeometry();
  linkGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(linkPos), 3));
  linkGeometry.setAttribute("aT", new THREE.BufferAttribute(new Float32Array(linkT), 1));
  linkGeometry.setAttribute("aInfo", new THREE.BufferAttribute(new Float32Array(linkInfo), 2));
  linkGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  /* At night the synapse web glows again — blue-violet threads with a cyan
     pulse travelling tip to tip. */
  const linkMaterial = new THREE.ShaderMaterial({
    name: "links",
    uniforms: shared,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aT;
      attribute vec2 aInfo;
      uniform vec3 uPointer;
      uniform float uPointerStrength;
      varying float vT, vPhase, vSpeed, vNear, vHere;
      ${SCAN_GLSL}
      void main() {
        vT = aT; vPhase = aInfo.x; vSpeed = aInfo.y;
        vNear = smoothstep(1.2, 0.0, distance(position, uPointer)) * uPointerStrength;
        vHere = scanned(position, 0.35);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime, uForm;
      varying float vT, vPhase, vSpeed, vNear, vHere;
      void main() {
        float pulse = fract(uTime * (0.08 + vSpeed * 0.14) + vPhase);
        float g = smoothstep(0.12, 0.0, abs(vT - pulse));
        g += smoothstep(0.05, 0.0, abs(vT - fract(pulse + 0.5))) * vNear;   /* second pulse fires near the cursor */
        float a = (0.08 + g * 0.7 + vNear * 0.2) * uForm * uForm * vHere;
        vec3 c = mix(vec3(0.30, 0.36, 0.95), vec3(0.55, 0.95, 1.0), clamp(g, 0.0, 1.0));
        gl_FragColor = vec4(c * a, a);
      }
    `,
  });
  const linkLines = new THREE.LineSegments(linkGeometry, linkMaterial);

  /* ---------------- nodes: the synapse endpoints breathe ---------------- */
  const nodePos = new Float32Array(tips.length * 3);
  const nodePh = new Float32Array(tips.length);
  tips.forEach((tp, i) => { nodePos.set(tp, i * 3); nodePh[i] = rand(); });
  const nodeGeometry = new THREE.BufferGeometry();
  nodeGeometry.setAttribute("position", new THREE.BufferAttribute(nodePos, 3));
  nodeGeometry.setAttribute("aPh", new THREE.BufferAttribute(nodePh, 1));
  nodeGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  const nodeMaterial = new THREE.ShaderMaterial({
    name: "nodes",
    uniforms: shared,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aPh;
      uniform float uTime, uForm, uPixelRatio, uPointerStrength;
      uniform vec3 uPointer;
      varying float vGlow;
      ${SCAN_GLSL}
      void main() {
        float breath = 0.5 + 0.5 * sin(uTime * 1.5 + aPh * 6.2832);
        float near = smoothstep(1.1, 0.0, distance(position, uPointer)) * uPointerStrength;
        vGlow = (0.35 + 0.65 * breath + near) * uForm * scanned(position, 0.35);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (3.4 + breath * 2.6 + near * 3.5) * uPixelRatio * (3.4 / -mv.z);
      }
    `,
    fragmentShader: /* glsl */`
      varying float vGlow;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.05, d) * vGlow * 0.8;
        if (a < 0.012) discard;
        vec3 c = mix(vec3(0.45, 0.55, 1.0), vec3(0.75, 0.98, 1.0), vGlow);
        gl_FragColor = vec4(c * a, a);
      }
    `,
  });
  const nodes = new THREE.Points(nodeGeometry, nodeMaterial);

  /* ---------------- grass: a brushed pelt over the limb's back ----------------
     Instanced ribbon blades rooted on the tube's upper surface. All motion —
     the resting lean, the wind, the cursor parting — happens in the vertex
     shader, so tens of thousands of blades cost the CPU nothing per frame and
     the whole pelt is one draw call. Technique from MengTo/Skills
     `threejs-landscape` (MIT); the placement reuses this scene's own segment
     frames, and the pointer response replaces the old particle repel. */
  const BLADES = narrow ? 15000 : 45000;
  const BLADE_ROWS = 4;                      // bend segments per blade

  function buildGrass() {
    /* one blade: a 2-column strip, x = side (-1..1), y = t (0..1) */
    const pos = [], idx = [];
    for (let rIdx = 0; rIdx <= BLADE_ROWS; rIdx++) {
      const t = rIdx / BLADE_ROWS;
      pos.push(-1, t, 0, 1, t, 0);
      if (rIdx > 0) {
        const a = (rIdx - 1) * 2, b = rIdx * 2;
        idx.push(a, a + 1, b + 1, a, b + 1, b);
      }
    }

    /* roots: same picker idiom as the particle shell, but only segments thick
       enough to carry grass, and only the upper face of the tube */
    const grassPick = makePicker(segs.filter((s) => s.r >= 0.09));
    const base = new Float32Array(BLADES * 3);
    const up = new Float32Array(BLADES * 3);
    const side = new Float32Array(BLADES * 3);
    const nrm = new Float32Array(BLADES * 3);   // root surface normal, for the light
    const data = new Float32Array(BLADES * 4);
    const W = new THREE.Vector3(), N = new THREE.Vector3(), DU = new THREE.Vector3();
    const UPV = new THREE.Vector3(0, 1, 0), S = new THREE.Vector3(), B = new THREE.Vector3();
    let placed = 0, guard = 0;
    while (placed < BLADES && guard++ < BLADES * 8) {
      const sg = grassPick(rand());
      frameOf(sg);                           // fills _d, _u, _v
      /* the ring direction closest to world-up — the tube's back. Near-vertical
         segments have no meaningful "top" and are skipped; their blades would
         fail the upward test anyway. */
      W.copy(UPV).addScaledVector(_d, -_d.y);
      if (W.lengthSq() < 0.05) continue;
      W.normalize();
      DU.crossVectors(_d, W);
      /* triangular spread around the crest of the ring: dense on top, sparse
         at the shoulders */
      const th = (rand() + rand() - 1) * 1.35;
      N.copy(W).multiplyScalar(Math.cos(th)).addScaledVector(DU, Math.sin(th)).normalize();
      if (N.y < 0.08) continue;
      const t = rand();
      const j3 = placed * 3, j4 = placed * 4;
      /* rooted a touch below the shell so the cut ends hide in the particle fuzz */
      const rr = sg.r * (1 - 0.03 * rand()) - 0.015;
      base[j3]     = sg.ax + (sg.bx - sg.ax) * t + N.x * rr;
      base[j3 + 1] = sg.ay + (sg.by - sg.ay) * t + N.y * rr;
      base[j3 + 2] = sg.az + (sg.bz - sg.az) * t + N.z * rr;
      nrm[j3] = N.x; nrm[j3 + 1] = N.y; nrm[j3 + 2] = N.z;
      /* blades grow along the surface normal pulled toward world-up */
      B.copy(N).lerp(UPV, 0.55).normalize();
      up[j3] = B.x; up[j3 + 1] = B.y; up[j3 + 2] = B.z;
      const az = rand() * Math.PI * 2;
      S.set(Math.sin(az), 0, Math.cos(az)).cross(B).normalize();
      side[j3] = S.x; side[j3 + 1] = S.y; side[j3 + 2] = S.z;
      const rScale = Math.min(1, Math.max(0.55, sg.r / 0.45));
      data[j4]     = (0.10 + rand() * 0.11) * rScale;   // height
      data[j4 + 1] = rand() * Math.PI * 2;              // wind phase
      data[j4 + 2] = rand();                            // tint
      data[j4 + 3] = (rand() - 0.5) * 2;                // resting lean
      placed++;
    }

    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.setAttribute("iBase", new THREE.InstancedBufferAttribute(base, 3));
    g.setAttribute("iUp", new THREE.InstancedBufferAttribute(up, 3));
    g.setAttribute("iSide", new THREE.InstancedBufferAttribute(side, 3));
    g.setAttribute("iNorm", new THREE.InstancedBufferAttribute(nrm, 3));
    g.setAttribute("iData", new THREE.InstancedBufferAttribute(data, 4));
    g.instanceCount = placed;
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);
    return g;
  }

  const grassMaterial = new THREE.ShaderMaterial({
    name: "grass",
    uniforms: { ...shared, ...palette },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      attribute vec3 iBase, iUp, iSide, iNorm;
      attribute vec4 iData;                  /* height, phase, tint, lean */
      uniform float uTime, uForm, uPointerStrength;
      uniform vec3 uPointer, uColorMoss, uColorLeaf, uColorHot, uColorA, uColorB;
      varying vec3 vColor;
      varying float vAlpha;
      ${SCAN_GLSL}
      ${GLOW_GLSL}
      void main() {
        float t = position.y;                /* 0 root · 1 tip */
        float here = scanned(iBase, 0.30);
        float hgt = iData.x * here * uForm;

        /* wind: two incommensurate sines per blade, so the field never beats
           in unison. uTime freezes under reduced motion and the pose is calm. */
        float wind = sin(uTime * 1.6 + iData.y + iBase.x * 0.8) * 0.16
                   + sin(uTime * 0.7 + iData.y * 1.7) * 0.07;

        /* the soft brush: blades near the cursor lean away and duck slightly,
           and spring back on the slow uPointerStrength release */
        vec3 toB = iBase - uPointer;
        float push = smoothstep(0.9, 0.0, length(toB)) * uPointerStrength;
        vec3 flat_ = toB - iUp * dot(toB, iUp);
        vec3 away = length(flat_) > 1e-4 ? normalize(flat_) : iSide;

        /* root fixed, deflection grows with t^2 up the blade */
        vec3 bend = (iSide * (iData.w * 0.22 + wind) + away * (push * 0.8)) * (t * t) * hgt;
        vec3 p = iBase
               + iSide * (position.x * 0.016 * (1.0 - t * 0.92) * here)
               + iUp * (t * hgt * (1.0 - push * 0.22))
               + bend;

        float edge = exp(-pow((distance(iBase, uScanOrigin) - scanFront(iBase)) / uScanEdge, 2.0)) * uScanOn;
        /* every blade glows its own colour out of the night spectrum — most
           run lime to cyan, a few go blue-violet, the rare one blooms magenta */
        float tt = iData.z;
        vec3 tipC = tt < 0.60 ? mix(uColorMoss, uColorB, tt / 0.60)
                  : tt < 0.90 ? mix(uColorB, uColorA, (tt - 0.60) / 0.30)
                  :             mix(uColorA, uColorLeaf, (tt - 0.90) / 0.10);
        float lum = lume(iBase);             /* the cursor lantern */
        vec3 c = mix(uColorMoss * 0.16, tipC, t * t);
        c *= (0.35 + 0.85 * t) * (0.55 + 0.45 * max(iNorm.y, 0.0))
           * (1.0 + lum * 3.0 + push * 0.5);
        c = mix(c, uColorHot, edge * 0.7);   /* the survey front */

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vColor = c * (1.0 - 0.40 * smoothstep(4.9, 7.2, -mv.z));
        vAlpha = (0.30 + 0.55 * t) * here;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        if (vAlpha < 0.02) discard;
        gl_FragColor = vec4(vColor * vAlpha, vAlpha);
      }
    `,
  });
  const grass = new THREE.Mesh(buildGrass(), grassMaterial);

  /* ---------------- flora: bioluminescent flowers + mushrooms ----------------
     Point-cloud blossoms in the reference's language: electric-blue petal
     clouds opening from ember-orange hearts, and rim-lit mushroom domes.
     Every point is placed on the CPU with its colour baked in; one Points
     mesh draws all of it. Each plant sways as a unit around its root, sprouts
     from that root as the survey front passes, and burns brighter under the
     cursor lantern. */
  const FLOWERS = narrow ? 55 : 140;
  const MUSHROOMS = narrow ? 30 : 85;
  const FLORA = FLOWERS + MUSHROOMS;
  function buildFlora() {
    const pts = [], cols = [], info = [], roots = [];
    const pick = makePicker(segs.filter((sg) => sg.r >= 0.12));
    const W = new THREE.Vector3(), N = new THREE.Vector3(), DU = new THREE.Vector3();
    const UPV = new THREE.Vector3(0, 1, 0);
    const U = new THREE.Vector3(), S1 = new THREE.Vector3(), S2 = new THREE.Vector3();
    const O = new THREE.Vector3(), T = new THREE.Vector3(), Q = new THREE.Vector3();

    /* a rooted spot on the limb's upper surface, or null to resample */
    function spot() {
      const sg = pick(rand());
      frameOf(sg);
      W.copy(UPV).addScaledVector(_d, -_d.y);
      if (W.lengthSq() < 0.05) return null;
      W.normalize(); DU.crossVectors(_d, W);
      const th = (rand() + rand() - 1) * 1.1;
      N.copy(W).multiplyScalar(Math.cos(th)).addScaledVector(DU, Math.sin(th)).normalize();
      if (N.y < 0.15) return null;
      const t = rand();
      return [sg.ax + (sg.bx - sg.ax) * t + N.x * (sg.r - 0.01),
              sg.ay + (sg.by - sg.ay) * t + N.y * (sg.r - 0.01),
              sg.az + (sg.bz - sg.az) * t + N.z * (sg.r - 0.01)];
    }
    function put(x, y, z, r, g, b, size, phase, sway, root) {
      pts.push(x, y, z); cols.push(r, g, b);
      info.push(phase, size, sway, 0); roots.push(root[0], root[1], root[2]);
    }
    function lean() {
      U.set((rand() - 0.5) * 0.35, 1, (rand() - 0.5) * 0.35).normalize();
      S1.set(U.y, -U.x, 0).normalize();
      S2.crossVectors(U, S1);
    }

    /* petals cool through blues and violets; hearts burn ember and amber —
       the reference's giant flower, miniaturised */
    const PETAL = [[0.34, 0.52, 1.0], [0.30, 0.44, 0.98], [0.55, 0.74, 1.0],
                   [0.60, 0.42, 1.0], [1.0, 0.42, 0.72]];
    const EMBER = [[1.0, 0.36, 0.22], [1.0, 0.60, 0.26], [1.0, 0.78, 0.42]];
    for (let f = 0, guard = 0; f < FLOWERS && guard < FLOWERS * 12; guard++) {
      const s = spot(); if (!s) continue;
      const ph = rand() * 6.283, sway = 0.012 + rand() * 0.02;
      const h = 0.15 + rand() * 0.17;
      lean();
      for (let i = 0; i <= 5; i++) {                     /* stem */
        const tt = i / 5;
        put(s[0] + U.x * h * tt, s[1] + U.y * h * tt, s[2] + U.z * h * tt,
            0.10, 0.42, 0.26, 0.8, ph, sway * tt * 0.6, s);
      }
      O.set(s[0] + U.x * h, s[1] + U.y * h, s[2] + U.z * h);
      const pc = PETAL[(rand() * PETAL.length) | 0];
      const ec = EMBER[(rand() * EMBER.length) | 0];
      const nP = 5 + ((rand() * 2) | 0);
      const L = 0.075 + rand() * 0.07;
      for (let k = 0; k < nP; k++) {
        const az = (k / nP) * 6.283 + (rand() - 0.5) * 0.5;
        T.copy(S1).multiplyScalar(Math.cos(az)).addScaledVector(S2, Math.sin(az));
        Q.crossVectors(U, T);                            /* the petal's width axis */
        const curl = 0.35 + rand() * 0.45;
        const m = 9 + ((rand() * 5) | 0);
        for (let j = 0; j < m; j++) {
          const sT = (j + 1) / m;
          const wJ = (rand() - 0.5) * 0.035 * Math.sin(sT * 3.1416);
          const cm = Math.min(1.0, sT * 1.7);            /* ember heart -> blue petal */
          put(O.x + T.x * L * sT + U.x * Math.sin(sT * 2.4) * L * curl + Q.x * wJ,
              O.y + T.y * L * sT + U.y * Math.sin(sT * 2.4) * L * curl + Q.y * wJ,
              O.z + T.z * L * sT + U.z * Math.sin(sT * 2.4) * L * curl + Q.z * wJ,
              ec[0] + (pc[0] - ec[0]) * cm,
              ec[1] + (pc[1] - ec[1]) * cm,
              ec[2] + (pc[2] - ec[2]) * cm,
              1.15 + rand() * 0.6, ph, sway, s);
        }
      }
      for (let j = 0; j < 7; j++)                        /* the hot core */
        put(O.x + (rand() - 0.5) * 0.02, O.y + (rand() - 0.5) * 0.02, O.z + (rand() - 0.5) * 0.02,
            ec[0] * 1.25, ec[1] * 1.25, ec[2] * 1.25, 2.3, ph, sway * 0.8, s);
      f++;
    }

    const CAP = [[0.24, 0.72, 1.0], [0.28, 0.95, 0.80], [0.56, 0.48, 1.0], [1.0, 0.68, 0.28]];
    for (let f = 0, guard = 0; f < MUSHROOMS && guard < MUSHROOMS * 12; guard++) {
      const s = spot(); if (!s) continue;
      const ph = rand() * 6.283, sway = 0.004 + rand() * 0.008;
      const h = 0.05 + rand() * 0.09;
      const Rc = 0.038 + rand() * 0.06;
      lean();
      const cc = CAP[(rand() * CAP.length) | 0];
      for (let i = 0; i <= 6; i++) {                     /* stem */
        const tt = i / 6;
        put(s[0] + U.x * h * tt, s[1] + U.y * h * tt, s[2] + U.z * h * tt,
            cc[0] * 0.22 + 0.06, cc[1] * 0.22 + 0.06, cc[2] * 0.22 + 0.08,
            0.85, ph, sway * tt * 0.5, s);
      }
      O.set(s[0] + U.x * h, s[1] + U.y * h, s[2] + U.z * h);
      const nC = 36 + ((rand() * 22) | 0);
      for (let j = 0; j < nC; j++) {                     /* dome — the RIM glows hardest */
        const rr = Rc * Math.sqrt(0.2 + 0.8 * rand());
        const az = rand() * 6.283;
        const rim = rr / Rc;
        const dome = (1 - rim * rim) * Rc * 0.65;
        const br = 0.40 + 0.80 * rim * rim;
        const cA = Math.cos(az), sA = Math.sin(az);
        put(O.x + (S1.x * cA + S2.x * sA) * rr + U.x * dome,
            O.y + (S1.y * cA + S2.y * sA) * rr + U.y * dome,
            O.z + (S1.z * cA + S2.z * sA) * rr + U.z * dome,
            cc[0] * br, cc[1] * br, cc[2] * br,
            0.95 + rim * 0.55, ph, sway, s);
      }
      f++;
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    g.setAttribute("aCol", new THREE.Float32BufferAttribute(cols, 3));
    g.setAttribute("aInfo", new THREE.Float32BufferAttribute(info, 4));
    g.setAttribute("aRoot", new THREE.Float32BufferAttribute(roots, 3));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);
    return g;
  }

  const floraMaterial = new THREE.ShaderMaterial({
    name: "flora",
    uniforms: { ...shared, ...palette },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec3 aCol, aRoot;
      attribute vec4 aInfo;                /* phase, size, sway */
      uniform float uTime, uForm, uPixelRatio, uPointerStrength;
      uniform vec3 uPointer, uColorHot;
      varying vec3 vColor;
      varying float vAlpha;
      ${SCAN_GLSL}
      ${GLOW_GLSL}
      void main() {
        /* each plant is gated on its ROOT, so it sprouts as one thing */
        float here = scanned(aRoot, 0.22);
        float edge = exp(-pow((distance(aRoot, uScanOrigin) - scanFront(aRoot)) / uScanEdge, 2.0)) * uScanOn;
        float swayA = sin(uTime * 1.1 + aInfo.x) * aInfo.z;
        vec3 p = position + vec3(swayA, 0.0, swayA * 0.6) * length(position - aRoot) * 8.0;
        p = mix(aRoot, p, here * uForm);   /* grows out of the bark */
        float lum = lume(aRoot);           /* the cursor lantern */
        float breathe = 0.95 + 0.20 * sin(uTime * 0.9 + aInfo.x);
        vec3 c = aCol * (breathe + lum * 2.6);
        c = mix(c, uColorHot, edge * 0.7);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vColor = c * (1.0 - 0.4 * smoothstep(4.9, 7.2, -mv.z));
        vAlpha = here * uForm;
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aInfo.y * (2.7 + lum * 1.6 + edge * 1.6) * uPixelRatio * (3.4 / -mv.z);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.12, d) * vAlpha;
        if (a < 0.012) discard;
        gl_FragColor = vec4(vColor * a, a);
      }
    `,
  });
  const flora = new THREE.Points(buildFlora(), floraMaterial);

  /* ---------------- the wire cage: topology that leads the front ----------------
     Rings and rails traced over every limb. Two representations share one
     conductor: this cage rides uScanRadius itself while the particle skin
     lands uScanLag behind it, so the form is explained before it is filled.
     It exists only for the entrance — at completion it is removed and its
     buffers disposed, because hiding it with opacity would leave the geometry
     and its shader running for the rest of the page.
     Technique from MengTo/Skills `build-wireframe-scan-reveal` (MIT). */
  const RING_SEGS = 8;
  function buildCage() {
    const pos = [];
    for (const br of branches) {
      const n = br.pts.length;
      const step = Math.max(1, Math.round(n / 16));
      const rings = [];
      for (let i = 0; i < n; i += step) {
        const p = br.pts[i];
        const a = br.pts[Math.max(0, i - 1)], b = br.pts[Math.min(n - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1], tz = b[2] - a[2];
        const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
        let ux = -ty, uy = tx, uz = 0;
        let ul = Math.hypot(ux, uy, uz);
        if (ul < 0.01) { ux = 1; uy = 0; uz = 0; ul = 1; }
        ux /= ul; uy /= ul; uz /= ul;
        const vx = ty * uz - tz * uy, vy = tz * ux - tx * uz, vz = tx * uy - ty * ux;
        const r = br.radii[i] * 1.02;
        const verts = [];
        for (let k = 0; k < RING_SEGS; k++) {
          const ang = (k / RING_SEGS) * Math.PI * 2;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          verts.push([p[0] + (ux * ca + vx * sa) * r,
                      p[1] + (uy * ca + vy * sa) * r,
                      p[2] + (uz * ca + vz * sa) * r]);
        }
        rings.push(verts);
      }
      for (const verts of rings)
        for (let k = 0; k < RING_SEGS; k++) {
          const k2 = (k + 1) % RING_SEGS;
          pos.push(verts[k][0], verts[k][1], verts[k][2],
                   verts[k2][0], verts[k2][1], verts[k2][2]);
        }
      for (let i = 1; i < rings.length; i++)
        for (let k = 0; k < RING_SEGS; k++)
          pos.push(rings[i - 1][k][0], rings[i - 1][k][1], rings[i - 1][k][2],
                   rings[i][k][0], rings[i][k][1], rings[i][k][2]);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);
    return g;
  }

  const uWire = { value: 0 };
  const uScanTrail = { value: SCAN.trail };
  const cageMaterial = new THREE.ShaderMaterial({
    name: "cage",
    uniforms: { ...shared, ...palette, uWire, uScanTrail },
    transparent: true,
    depthWrite: false,
    /* depth test stays ON: without it the back half of the cage shows through
       and the limb turns into an unreadable bright ball */
    depthTest: true,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      varying vec3 vLocal;
      void main() {
        vLocal = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uWire, uScanTrail;
      uniform vec3 uColorB;
      varying vec3 vLocal;
      ${SCAN_GLSL}
      void main() {
        float d = distance(vLocal, uScanOrigin);
        float rim = exp(-pow((d - uScanRadius) / uScanEdge, 2.0));
        /* written as 1 - smoothstep(low, high, d) rather than the shorter
           smoothstep(high, low, d): GLSL leaves edge0 > edge1 undefined, and
           some drivers return 0, which silently deletes the whole trail */
        float trail = 1.0 - smoothstep(uScanRadius - uScanTrail, uScanRadius, d);
        float a = (rim * 1.6 + trail * 0.34) * uWire;
        if (a < 0.012) discard;
        vec3 c = mix(uColorB, vec3(0.90, 0.97, 1.0), rim * 0.7);
        gl_FragColor = vec4(c * a, min(a, 0.82));
      }
    `,
  });
  let cage = new THREE.LineSegments(buildCage(), cageMaterial);
  function disposeCage() {
    if (!cage) return;
    organism.remove(cage);
    cage.geometry.dispose();
    cage.material.dispose();
    cage = null;
  }

  /* ---------------- moths: two glowing visitors ---------------- */
  const MOTHS = narrow ? 1 : 2;
  /* Each butterfly is its own little point cloud, in the same language as
     the flora: the shape is carried by where the points sit, not by any
     surface. Two overlapping lobes per side (fore + hind wing) with the edge
     kept denser and brighter so the silhouette reads, a beaded body, and a
     pair of antennae. */
  function makeMothGeometry() {
    const pos = [], side = [], span = [], rim = [], tint = [], size = [];
    function pt(x, z, s, edge, sz) {
      pos.push(x * s, 0, z); side.push(s);
      span.push(Math.min(1, Math.abs(x) / 0.13));
      rim.push(edge); tint.push(rand()); size.push(sz);
    }
    function lobe(cx, cz, rx, rz, rot, n, s) {
      const cr = Math.cos(rot), sr = Math.sin(rot);
      for (let i = 0; i < n; i++) {
        const u = Math.sqrt(rand()), a = rand() * Math.PI * 2;
        const lx = Math.cos(a) * u * rx, lz = Math.sin(a) * u * rz;
        pt(cx + lx * cr - lz * sr, cz + lx * sr + lz * cr, s,
           u * u, 0.9 + u * 0.7 + (rand() - 0.5) * 0.3);
      }
      /* a ring right on the perimeter — the wing's bright leading edge */
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2;
        const lx = Math.cos(a) * rx, lz = Math.sin(a) * rz;
        pt(cx + lx * cr - lz * sr, cz + lx * sr + lz * cr, s,
           1.0, 1.3 + rand() * 0.4);
      }
    }
    for (const s of [-1, 1]) {
      lobe(0.072, 0.028, 0.062, 0.044, 0.28, 200, s);    /* forewing */
      lobe(0.052, -0.044, 0.048, 0.040, -0.22, 140, s);  /* hindwing */
      for (let i = 0; i < 7; i++) {                      /* antenna */
        const t = i / 6;
        pt(0.012 + t * 0.034 + t * t * 0.012, 0.062 + t * 0.045, s, 1.0, 0.85);
      }
    }
    for (let i = 0; i < 24; i++) {                       /* beaded body */
      const t = i / 23;
      pt((rand() - 0.5) * 0.006, 0.062 - t * 0.14, 0, 0.0, 1.5 + (rand() - 0.5) * 0.4);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute("aSide", new THREE.BufferAttribute(new Float32Array(side), 1));
    g.setAttribute("aSpan", new THREE.BufferAttribute(new Float32Array(span), 1));
    g.setAttribute("aRim", new THREE.BufferAttribute(new Float32Array(rim), 1));
    g.setAttribute("aTint", new THREE.BufferAttribute(new Float32Array(tint), 1));
    g.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(size), 1));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1);
    return g;
  }
  const mothGeometry = makeMothGeometry();
  function makeMothMaterial(phase, variant, scale) {
    return new THREE.ShaderMaterial({
      name: "moth",
      uniforms: { uTime: shared.uTime, uForm: shared.uForm, uPixelRatio: shared.uPixelRatio,
                  uPhase: { value: phase }, uVariant: { value: variant },
                  /* Points ignore object scale for their sprite size, so the
                     butterfly's scale has to reach the shader by hand */
                  uScale: { value: scale }, ...palette },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: /* glsl */`
        attribute float aSide, aSpan, aRim, aTint, aSize;
        uniform float uTime, uForm, uPhase, uPixelRatio, uVariant, uScale;
        uniform vec3 uColorA, uColorB, uColorHot, uColorLeaf;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          /* the outer wing lags a beat behind the stroke — cloth, not hinge */
          float stroke = uTime * 9.0 + uPhase * 6.2832 - aSpan * 0.8;
          /* capped fold: wings pump but never collapse into an edge-on line */
          float a = (sin(stroke) * 0.72 + 0.16) * aSide;
          vec3 p = vec3(position.x * cos(a), position.x * sin(a), position.z);
          float flap = abs(sin(stroke));

          /* warm gold body cooling into the wing colour; each butterfly gets
             its own tip hue — one cyan, one violet-magenta */
          vec3 wingC = mix(uColorB, mix(uColorA, uColorLeaf, 0.5), uVariant);
          vec3 c = mix(uColorHot * 1.15, wingC, smoothstep(0.05, 0.8, aSpan));
          c *= 0.75 + aRim * 0.55;                      /* the edge carries the shape */
          float tw = 0.72 + 0.28 * sin(uTime * 6.0 + aTint * 40.0);   /* shimmer */
          /* wings pulse with the stroke; the body stays constant */
          vAlpha = mix(1.0, 0.62 + 0.38 * flap, abs(aSide)) * tw * uForm * uForm;
          vColor = c;

          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aSize * uScale * (2.1 + flap * 0.4) * uPixelRatio * (3.4 / -mv.z);
        }
      `,
      fragmentShader: /* glsl */`
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.12, d) * vAlpha;
          if (a < 0.012) discard;
          gl_FragColor = vec4(vColor * a, a);
        }
      `,
    });
  }
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  const moths = [];
  for (let m = 0; m < MOTHS; m++) {
    const sc = 1.55 + rand() * 0.45;              /* stage presence, not a speck */
    const mesh = new THREE.Points(mothGeometry,
      makeMothMaterial(rand(), MOTHS > 1 ? m / (MOTHS - 1) : 0, sc));
    mesh.scale.setScalar(sc);
    const tp = tips[(rand() * tips.length) | 0];
    moths.push({
      mesh,
      pos: new THREE.Vector3(tp[0], tp[1] + 0.3, tp[2] + 0.4),
      vel: new THREE.Vector3(0.2, 0, 0),
      anchor: new THREE.Vector3().fromArray(tips[(rand() * tips.length) | 0]),
      timer: 2 + m * 3,
      phase: rand() * 6.28,
    });
  }
  function updateMoths(dt, t) {
    for (const mo of moths) {
      mo.timer -= dt;
      if (mo.timer <= 0) {                      /* pick the next perch to orbit */
        mo.anchor.fromArray(tips[(rand() * tips.length) | 0]);
        mo.timer = 4 + rand() * 5;
      }
      tmpA.copy(mo.anchor);
      tmpA.x += Math.sin(t * 0.9 + mo.phase) * 0.35;
      tmpA.y += Math.cos(t * 0.7 + mo.phase * 2.0) * 0.25 + 0.15;
      tmpA.z += Math.sin(t * 0.6 + mo.phase * 3.0) * 0.3;
      if (shared.uPointerStrength.value > 0.55) tmpA.lerp(shared.uPointer.value, 0.4);
      tmpB.subVectors(tmpA, mo.pos).multiplyScalar(1.4);
      mo.vel.addScaledVector(tmpB, dt).clampLength(0, 0.6);
      mo.pos.addScaledVector(mo.vel, dt);
      mo.mesh.position.copy(mo.pos);
      if (mo.vel.lengthSq() > 1e-6)
        mo.mesh.quaternion.setFromUnitVectors(tmpA.set(0, 0, 1), tmpB.copy(mo.vel).normalize());
    }
  }
  const mothMeshes = moths.map((m) => m.mesh);

  /* one transform for the whole organism */
  const organism = new THREE.Group();
  organism.add(points, grass, flora, linkLines, nodes, ...mothMeshes);
  if (cage) { organism.add(cage); cage.renderOrder = 0; }
  points.renderOrder = 1; grass.renderOrder = 1; flora.renderOrder = 2; linkLines.renderOrder = 2; nodes.renderOrder = 3;
  mothMeshes.forEach((m) => { m.renderOrder = 4; });
  organism.rotation.set(0.06, -0.25, 0.0);
  organism.scale.setScalar(0.7);
  scene.add(organism);

  /* The canvas's painted box — the one number everything else is derived from.
     Cached because the pointer handler would otherwise force a layout read on
     every mouse move; the canvas is position:fixed, so scrolling cannot move
     it and only a resize can invalidate this. */
  let box = { left: 0, top: 0, width: 0, height: 0 };

  function layout() {
    /* Measure the ELEMENT, never window.innerWidth. renderer.setSize(w, h,
       false) deliberately leaves the canvas's CSS size alone, so the painted
       box is whatever the stylesheet makes it. Sizing the drawing buffer from
       the window instead means the two can disagree — a classic scrollbar, a
       zoomed page, a viewport unit resolving differently — and the scene is
       then rendered at one size and stretched to another. That is a single
       fault with two faces: the limb walks off the frame, and the pointer's
       repel bubble lands somewhere the cursor is not. */
    const r = canvas.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (!w || !h) return;                    // guard a zero-sized root
    box = { left: r.left, top: r.top, width: r.width, height: r.height };

    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    /* Framing from what the camera can actually see, not from pixel counts.
       The vertical field of view is fixed, so the visible HEIGHT is the same
       3.5-odd world units on every display; only the width moves with the
       frame's shape. So the limb's thickness is tied to that height and comes
       out identical everywhere, and the spine's long tails — not a bigger
       scale — are what keep it running off both edges. Driving the scale off
       the width instead is what made the scene close in and swallow the copy
       on a laptop: a narrower frame shrank the limb, but it shrank the room
       around it faster. */
    const visH = 2 * camera.position.z * Math.tan((camera.fov * Math.PI / 180) / 2);
    const visW = visH * camera.aspect;
    const LIMB_DIAM = 0.84;                  // local units across the crest
    const portrait = camera.aspect < 1.05;
    /* the limb reads as this fraction of the frame's height, always */
    const thickness = portrait ? 0.125 : 0.155;
    const scale = (visH * thickness) / LIMB_DIAM;
    organism.scale.setScalar(scale);

    /* Anchor the crest, not the group's origin: park it this far down the
       frame so the upper left stays clear for the headline and the card. */
    const crestDepth = portrait ? 0.72 : 0.66;          // fraction of frame height
    const crestNdcY = 1 - 2 * crestDepth;
    organism.position.y = crestNdcY * (visH / 2) - CREST_LOCAL_Y * scale;
    organism.position.x = portrait ? -0.15 : 0.05;

    /* setSize clears the drawing buffer, so a resize between two animation
       frames — or while the entrance is parked — would otherwise leave an
       empty canvas until the next tick. */
    renderer.render(scene, camera);
  }
  layout();
  /* ResizeObserver, not the window's resize event: it fires for any change to
     the element's box, including ones the window never sees. */
  const ro = new ResizeObserver(layout);
  ro.observe(canvas);

  /* pointer → world plane at z 0 → organism space */
  const ndc = new THREE.Vector2(9, 9);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const ray = new THREE.Raycaster();
  const hit = new THREE.Vector3();
  const target = new THREE.Vector3(99, 99, 0);
  let targetStrength = 0;
  addEventListener("pointermove", (e) => {
    if (!box.width || !box.height) return;
    /* against the canvas's own box, so the cursor and the scene agree even if
       the canvas is ever inset from the viewport */
    ndc.set(((e.clientX - box.left) / box.width) * 2 - 1,
            -((e.clientY - box.top) / box.height) * 2 + 1);
    targetStrength = 1;
  });
  addEventListener("pointerleave", () => { targetStrength = 0; });
  /* resolved every frame with the CURRENT camera — resolving only on
     pointermove leaves the repel bubble trailing while the parallax
     camera keeps drifting */
  function resolvePointer() {
    if (ndc.x === 9) return;
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) {
      organism.updateMatrixWorld();
      target.copy(organism.worldToLocal(hit));
    }
  }

  /* telemetry — the numbers in the footer are the scene's real numbers */
  const telemetry = document.getElementById("telemetry");
  let fps = 60, lastTelemetry = 0;

  const clock = new THREE.Clock();
  let scanT = reducedMotion ? 1 : 0;
  let scanning = !reducedMotion;
  let raf = 0;
  const smoothstepJS = (a, b, x) => {
    x = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return x * x * (3 - 2 * x);
  };

  function frame() {
    raf = requestAnimationFrame(frame);
    /* clamped to a 30fps step: one long frame must not let the front skip a
       whole stretch of the limb and leave it looking pre-assembled */
    const dt = Math.min(clock.getDelta(), 1 / 30);
    shared.uTime.value = clock.elapsedTime;

    if (scanning) {
      scanT = Math.min(1, scanT + dt / SCAN.dur);
      /* eased travel — linear stalls visually as it reaches for the far corner */
      shared.uScanRadius.value = (1 - Math.pow(1 - scanT, 1.35)) * SCAN.maxR;
      /* the cage snaps on over the first 6%, then burns off over the last 28%
         so it never competes with the finished surface */
      uWire.value = Math.min(1, scanT / 0.06) * (1 - smoothstepJS(0.72, 1, scanT));
      shared.uForm.value = Math.min(1, scanT / 0.22);
      if (scanT >= 1) {
        scanning = false;
        shared.uScanOn.value = 0;      // stop paying for the discard branch
        uWire.value = 0;
        disposeCage();
      }
    }

    camera.position.x += (ndc.x === 9 ? 0 : ndc.x * 0.1 - camera.position.x) * 0.03;
    camera.position.y += (ndc.y === 9 ? 0 : ndc.y * 0.06 - camera.position.y) * 0.03;
    camera.lookAt(0.55, 0, 0);

    resolvePointer();
    shared.uPointer.value.lerp(target, 1 - Math.pow(0.0002, dt));
    shared.uPointerStrength.value += (targetStrength * 0.9 + 0.1 - shared.uPointerStrength.value) * (1 - Math.pow(0.002, dt));

    updateMoths(dt, clock.elapsedTime);
    renderer.render(scene, camera);

    if (dt > 0) fps += (1 / dt - fps) * 0.06;
    if (clock.elapsedTime - lastTelemetry > 0.5) {
      lastTelemetry = clock.elapsedTime;
      telemetry.textContent = `${COUNT.toLocaleString("en-US")} points · ${BLADES.toLocaleString("en-US")} blades · ${FLORA} flora · ${links} synapses · ${MOTHS} moths · ${Math.round(fps)} fps`;
    }
  }

  document.body.classList.add("gl-ready");
  window.__atlas = {
    shared, organism, moths, SCAN, scene, camera, renderer, points, grass, flora,
    render: () => renderer.render(scene, camera),
    /* jump to the finished state */
    warp() {
      scanT = 1; scanning = false;
      shared.uForm.value = 1; shared.uScanOn.value = 0; uWire.value = 0; disposeCage();
    },
    /* Park the sweep at a fraction of its travel and HOLD it there — the frame
       loop keeps drawing, it just stops advancing. Leaving the loop to resume
       makes the entrance finish before you can look at it, and killing rAF
       instead leaves the canvas stale the moment anything triggers a resize. */
    seek(t) {
      scanT = Math.max(0, Math.min(1, t)); scanning = false;
      shared.uScanOn.value = 1;
      shared.uScanRadius.value = (1 - Math.pow(1 - scanT, 1.35)) * SCAN.maxR;
      uWire.value = Math.min(1, scanT / 0.06) * (1 - smoothstepJS(0.72, 1, scanT));
      shared.uForm.value = Math.min(1, scanT / 0.22);
      renderer.render(scene, camera);
    },
    /* Resume from wherever seek() parked it. The cage is gone for good once a
       sweep has completed — disposing it is the point — so a true replay means
       reloading the page, not calling this. */
    play(from) {
      if (from !== undefined) scanT = Math.max(0, Math.min(1, from));
      scanning = scanT < 1; shared.uScanOn.value = 1;
    },
    get scanT() { return scanT; },
    get caged() { return !!cage; },
    get fps() { return fps; },
  };
  addEventListener("error", (e) => { (window.__atlasErrors ??= []).push(String(e.message)); });

  if (reducedMotion) {
    /* the finished limb, held still. The scan skill composes a mid-sweep
       diagnostic still instead, but that is a demo showing off the technique;
       here the scene is a backdrop, so the settled state is the honest one. */
    shared.uForm.value = 1;
    shared.uTime.value = 40;
    shared.uScanOn.value = 0;
    uWire.value = 0;
    disposeCage();
    renderer.render(scene, camera);
    telemetry.textContent = `${COUNT.toLocaleString("en-US")} points · ${BLADES.toLocaleString("en-US")} blades · ${FLORA} flora · ${links} synapses · ${MOTHS} moths · still`;
    return;
  }

  frame();
  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(raf);
    /* the dt clamp in frame() swallows the gap; restarting the clock
       would rewind uTime and make the whole field jump */
    if (!document.hidden) frame();
  });
}

start();
</script>
</body>
</html>
