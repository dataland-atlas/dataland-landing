<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Dataland</title>
<meta name="description" content="Atlas is the internal operating system of Dataland — reports, files, identity, and chat for the studio.">
<meta name="theme-color" content="#060608">
<style>
  /* ---------- fonts (vendored, OFL 1.1 — see licenses/GEIST-OFL.txt) ---------- */
  @font-face {
    font-family: "Geist";
    src: url("assets/geist-sans-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("assets/geist-mono-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  /* ---------- tokens ---------- */
  :root {
    --void: #060608;
    --bone: #ededef;
    --mist: #8b8b94;
    --hairline: rgba(237, 237, 239, 0.14);
    --hairline-quiet: rgba(237, 237, 239, 0.08);
    --card: rgba(10, 10, 13, 0.62);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --font-sans: "Geist", system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }
  body {
    min-height: 100dvh;
    background: var(--void);
    color: var(--bone);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow-x: hidden;
  }

  ::selection { background: rgba(122, 92, 255, 0.35); }

  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--bone);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------- canvas / fallback ground ---------- */
  #field {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 1600ms ease;
  }
  body.gl-ready #field { opacity: 1; }
  /* before GL is up (and forever, if it never comes up) a quiet pigment haze
     keeps the page from being a black hole */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(42% 55% at 68% 46%, rgba(122, 92, 255, 0.14), transparent 70%),
      radial-gradient(30% 40% at 74% 62%, rgba(79, 200, 224, 0.10), transparent 70%),
      var(--void);
  }

  /* ---------- chrome ---------- */
  .nav, .foot { position: relative; z-index: 2; }

  .nav {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 4vw, 48px);
    border-bottom: 1px solid var(--hairline-quiet);
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .brand i {
    width: 7px; height: 7px;
    background: var(--bone);
    display: inline-block;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 13px;
    color: var(--mist);
    transition: color 160ms;
  }
  .nav-links a:hover { color: var(--bone); }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    padding: clamp(32px, 6vh, 80px) clamp(20px, 4vw, 48px);
  }
  .hero-inner { width: min(1200px, 100%); margin: 0 auto; }
  .hero-copy { max-width: 560px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
  }

  h1 {
    margin: 18px 0 14px;
    font-size: clamp(64px, 11vw, 128px);
    font-weight: 550;
    letter-spacing: -0.045em;
    line-height: 0.95;
  }

  .lede {
    font-size: 15px;
    color: var(--mist);
    max-width: 42ch;
  }
  .lede strong { color: var(--bone); font-weight: 500; }

  /* ---------- sign in ---------- */
  .gate {
    margin-top: 40px;
    max-width: 380px;
    border: 1px solid var(--hairline);
    background: var(--card);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    padding: 22px 22px 18px;
  }
  .gate-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
    display: block;
  }
  .gate input[type="email"] {
    width: 100%;
    margin-top: 12px;
    padding: 9px 2px 10px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    caret-color: var(--bone);
    transition: border-color 160ms;
  }
  .gate input[type="email"]::placeholder { color: rgba(139, 139, 148, 0.55); }
  .gate input[type="email"]:focus {
    outline: none;
    border-bottom-color: var(--bone);
  }
  .gate button {
    margin-top: 18px;
    width: 100%;
    padding: 11px 16px;
    background: var(--bone);
    color: var(--void);
    border: 0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 160ms;
  }
  .gate button:hover { background: #ffffff; }
  .gate button .arrow { transition: transform 200ms var(--ease-out-expo); }
  .gate button:hover .arrow { transform: translateX(3px); }
  .gate-meta {
    margin-top: 14px;
    font-size: 12px;
    color: var(--mist);
  }

  /* ---------- footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 clamp(20px, 4vw, 48px);
    height: 52px;
    border-top: 1px solid var(--hairline-quiet);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--mist);
    white-space: nowrap;
  }
  .foot .services { display: flex; gap: 18px; text-transform: uppercase; }
  .foot .telemetry { text-transform: uppercase; }

  /* ---------- entrance ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  .rise {
    animation: rise 700ms var(--ease-out-expo) both;
    animation-delay: calc(var(--i, 0) * 90ms);
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
    #field { transition: none; }
    .gate button .arrow { transition: none; }
  }

  /* ---------- narrow ---------- */
  @media (max-width: 720px) {
    body.gl-ready #field { opacity: 0.6; }
    .nav-links { gap: 20px; }
    .hero { align-items: flex-start; padding-top: 9vh; }
    .gate { max-width: none; }
    .foot { font-size: 10px; }
    .foot .services { gap: 12px; }
    .foot .seed { display: none; }
  }
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<header class="nav">
  <a class="brand rise" style="--i: 0" href="/" aria-label="Dataland home"><i aria-hidden="true"></i>DATALAND</a>
  <nav class="nav-links rise" style="--i: 1" aria-label="Primary">
    <a href="https://github.com/dataland-atlas">Docs</a>
    <a href="#email" id="nav-signin">Sign in</a>
  </nav>
</header>

<main class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="eyebrow rise" style="--i: 2">Dataland — internal platform</p>
      <h1 class="rise" style="--i: 3">Atlas</h1>
      <p class="lede rise" style="--i: 4">
        The operating system behind the studio&rsquo;s work —
        <strong>reports, files, identity, and chat</strong> in one place.
      </p>

      <form class="gate rise" style="--i: 5" id="gate" novalidate>
        <label class="gate-label" for="email">Sign in</label>
        <input type="email" id="email" name="email" placeholder="you@dataland.team"
               autocomplete="email" spellcheck="false" required>
        <button type="submit">Continue <span class="arrow" aria-hidden="true">&rarr;</span></button>
        <p class="gate-meta">Access is provisioned by your workspace admin.</p>
      </form>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="services rise" style="--i: 6">
    <span>Reports</span><span>Files</span><span>IAM</span><span>Chat</span>
  </div>
  <div class="telemetry rise" style="--i: 7" aria-hidden="true">
    <span class="seed">seed A71A5 · </span><span id="telemetry">&nbsp;</span>
  </div>
</footer>

<script type="module">
import * as THREE from "./assets/three.module.min.js";

/* Where "Continue" goes until IAM wiring lands. */
const APP_URL = "https://atlas.dataland.team";

const form = document.getElementById("gate");
const email = document.getElementById("email");
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = email.value.trim();
  if (!email.checkValidity() || !v) { email.reportValidity?.(); email.focus(); return; }
  window.location.href = `${APP_URL}/?email=${encodeURIComponent(v)}`;
});
document.getElementById("nav-signin").addEventListener("click", (e) => {
  e.preventDefault();
  email.focus({ preventScroll: false });
  email.scrollIntoView({ behavior: "smooth", block: "center" });
});

/* ------------------------------------------------------------------ *
 *  The synapse tree.
 *  A deterministic branching skeleton is grown once on the CPU; the
 *  particles are the tree's flesh (dense at the trunk, sparse pigment
 *  at the tips), branch tips become synapse nodes, and near tips are
 *  linked by lines that carry travelling light pulses. The pointer
 *  parts the particles and makes the nearby synapses fire brighter.
 * ------------------------------------------------------------------ */

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("field");

/* Deterministic PRNG — the same tree grows on every load. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* shared shader chunks */
const NOISE_GLSL = /* glsl */`
  float hash(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float vnoise(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    vec3 u = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash(i), hash(i + vec3(1,0,0)), u.x),
          mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), u.x), u.y),
      mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), u.x),
          mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), u.x), u.y),
      u.z);
  }
  float fbm(vec3 p) {
    return 0.55 * vnoise(p) + 0.30 * vnoise(p * 2.13) + 0.15 * vnoise(p * 4.71);
  }
`;

function start() {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: "high-performance" });
  } catch { return; }

  const dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);

  const narrow = matchMedia("(max-width: 720px)").matches;
  const COUNT = narrow ? 70000 : 220000;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 40);
  camera.position.set(0, 0, 4.6);

  const rand = mulberry32(0xa71a5);

  /* ---------------- grow the skeleton ---------------- */
  const segs = [];            // {ax..bz, r, depth} — for particle placement
  const branches = [];        // polylines — for the solid wood
  const tips = [];
  const MAX_SEGS = 5200;
  function branch(px, py, pz, dx, dy, dz, len, depth) {
    if (segs.length > MAX_SEGS) return;
    const steps = 6;
    const pts = [[px, py, pz]];
    const r0 = 0.19 * Math.pow(0.62, depth);
    for (let i = 0; i < steps; i++) {
      dx += (rand() - 0.5) * 0.36;
      dy += (rand() - 0.5) * 0.22 + 0.04;
      dz += (rand() - 0.5) * 0.36;
      const il = 1 / Math.hypot(dx, dy, dz); dx *= il; dy *= il; dz *= il;
      const s = len / steps;
      const qx = px + dx * s, qy = py + dy * s, qz = pz + dz * s;
      segs.push({ ax: px, ay: py, az: pz, bx: qx, by: qy, bz: qz,
                  r: r0, depth, len: s });
      px = qx; py = qy; pz = qz;
      pts.push([px, py, pz]);
      if (depth < 5 && i >= 1 && rand() < 0.5) {
        let cx = dx + (rand() - 0.5) * 1.8;
        let cy = dy + (rand() - 0.35) * 1.15;
        let cz = dz + (rand() - 0.5) * 1.8;
        const cl = 1 / Math.hypot(cx, cy, cz);
        branch(px, py, pz, cx * cl, cy * cl, cz * cl, len * 0.64, depth + 1);
      }
    }
    branches.push({ pts, r0, depth });
    if (depth >= 2) tips.push([px, py, pz]);
  }
  branch(0, -1.55, 0, 0.06, 1, 0, 1.7, 0);

  /* cumulative length table for length-weighted particle placement */
  const cum = new Float64Array(segs.length);
  let total = 0;
  for (let i = 0; i < segs.length; i++) { total += segs[i].len * (1 + segs[i].depth * 0.35); cum[i] = total; }
  function pickSeg(u) {
    let lo = 0, hi = segs.length - 1;
    const x = u * total;
    while (lo < hi) { const mid = (lo + hi) >> 1; (cum[mid] < x) ? lo = mid + 1 : hi = mid; }
    return segs[lo];
  }
  const g3 = () => (rand() + rand() + rand() - 1.5) * 0.82;   // cheap gaussian

  /* ---------------- particles: the tree's flesh + an ambient aura ---------------- */
  const base = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT * 4);
  const AMBIENT = 0.22;
  for (let i = 0; i < COUNT; i++) {
    const j3 = i * 3, j4 = i * 4;
    const ambient = rand() < AMBIENT;
    if (ambient) {
      base[j3]     = (rand() - 0.5) * 3.6;
      base[j3 + 1] = (rand() - 0.5) * 3.0 + 0.1;
      base[j3 + 2] = (rand() - 0.5) * 1.8;
      seed[j4 + 1] = rand();                 // free-floating depth key
      seed[j4 + 3] = 1;                      // kind: ambient
    } else {
      const sg = pickSeg(rand());
      const t = rand();
      const spread = sg.r * 1.6 + 0.01;
      base[j3]     = sg.ax + (sg.bx - sg.ax) * t + g3() * spread;
      base[j3 + 1] = sg.ay + (sg.by - sg.ay) * t + g3() * spread;
      base[j3 + 2] = sg.az + (sg.bz - sg.az) * t + g3() * spread;
      seed[j4 + 1] = sg.depth / 5;           // depth along the tree
      seed[j4 + 3] = 0;                      // kind: tree
    }
    seed[j4]     = rand();
    seed[j4 + 2] = rand();
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(base, 3));
  geometry.setAttribute("aSeed", new THREE.BufferAttribute(seed, 4));
  geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  const shared = {
    uTime:            { value: 0 },
    uForm:            { value: reducedMotion ? 1 : 0 },
    uPixelRatio:      { value: dpr },
    uPointer:         { value: new THREE.Vector3(99, 99, 0) },
    uPointerStrength: { value: 0 },
  };
  const palette = {
    uColorA:   { value: new THREE.Color("#7a5cff") },
    uColorB:   { value: new THREE.Color("#4fc8e0") },
    uColorHot: { value: new THREE.Color("#f0efff") },
    uColorMoss: { value: new THREE.Color("#6faf4e") },
    uColorLeaf: { value: new THREE.Color("#c4e88f") },
  };

  const particleMaterial = new THREE.ShaderMaterial({
    name: "particles",
    uniforms: { ...shared, ...palette },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec4 aSeed;
      uniform float uTime, uForm, uPixelRatio, uPointerStrength;
      uniform vec3 uPointer, uColorA, uColorB, uColorHot, uColorMoss, uColorLeaf;
      varying vec3 vColor;
      varying float vAlpha;
      ${NOISE_GLSL}
      void main() {
        vec3 aBase = position;
        float kind = aSeed.w;                 /* 0 tree · 1 ambient */
        float tipness = aSeed.y;              /* 0 trunk · 1 outer twigs */

        vec3 dir = normalize(aBase + vec3(0.001, 0.002, 0.001));
        vec3 scatter = dir * (3.5 + aSeed.x * 4.5);
        vec3 p = mix(scatter, aBase, uForm);

        float t = uTime * 0.10;
        vec3 q = aBase * vec3(0.55, 0.85, 0.7);
        vec3 warp = vec3(
          fbm(q * 1.1 + vec3(0.0, t * 0.8, t * 0.3)),
          fbm(q * 1.1 + vec3(5.2, 1.3 - t * 0.6, t * 0.2)),
          fbm(q * 1.1 + vec3(9.7, t * 0.4, 3.1))
        ) - 0.5;
        float w = fbm(q * 1.6 + warp * 2.2 + vec3(0.0, 0.0, t));

        /* the trunk barely breathes; twigs and loose pigment drift */
        float amp = mix(0.05 + tipness * 0.24, 0.55, kind);
        vec3 flow = warp * amp * 2.0;
        flow.y += sin(aBase.x * 1.9 + uTime * 0.45 + warp.x * 4.0) * amp * 0.5;
        p += flow * uForm;

        /* pointer: the flesh parts around the cursor, roots stand firm */
        vec3 toP = p - uPointer;
        float d = length(toP);
        float infl = smoothstep(1.0, 0.0, d) * uPointerStrength
                   * mix(0.3 + 0.7 * tipness, 1.0, kind);
        vec3 away = normalize(toP + 0.0001);
        p += away * infl * 0.45;
        p += cross(away, vec3(0.0, 0.0, 1.0)) * infl * 0.3;

        /* ambient pigment only survives on the warped field's ridges */
        float fil = smoothstep(0.42, 0.78, w);
        float keep = mix(1.0, 0.08 + 0.92 * fil, kind);

        vec3 nature = mix(uColorMoss, uColorLeaf, clamp(tipness * 1.15 - 0.1 + warp.x * 0.4, 0.0, 1.0));
        vec3 machine = mix(uColorA, uColorB, clamp(0.5 - aBase.y * 0.4 + warp.x * 1.1, 0.0, 1.0));
        vec3 pig = mix(nature, machine, kind);
        float sparkle = smoothstep(0.78, 0.97, vnoise(aBase * 9.0 + vec3(0.0, 0.0, uTime * 0.6)));
        float hot = mix(smoothstep(0.86, 1.0, tipness) * (0.18 + 0.5 * sparkle),
                        smoothstep(0.80, 0.98, w), kind)
                  + infl * 1.2;
        pig = mix(pig, uColorHot, clamp(hot, 0.0, 1.0));

        vColor = pig * mix(0.85 + 0.75 * tipness, 0.5 + 0.9 * fil, kind) * keep;
        vAlpha = (0.32 + 0.68 * aSeed.z) * keep;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.2 + aSeed.z * 1.5 + hot * 1.4) * uPixelRatio * (3.4 / -mv.z);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.16, d) * vAlpha;
        if (a < 0.012) discard;
        gl_FragColor = vec4(vColor * a, a);
      }
    `,
  });
  const points = new THREE.Points(geometry, particleMaterial);

  /* ---------------- synapses: tips linked to their neighbours ---------------- */
  const linkPos = [];
  const linkT = [];
  const linkInfo = [];
  let links = 0;
  const MAXD2 = 0.85 * 0.85;
  for (let i = 0; i < tips.length; i++) {
    let n1 = -1, n2 = -1, d1 = MAXD2, d2 = MAXD2;
    for (let j = 0; j < tips.length; j++) {
      if (j === i) continue;
      const dx = tips[i][0] - tips[j][0], dy = tips[i][1] - tips[j][1], dz = tips[i][2] - tips[j][2];
      const dd = dx * dx + dy * dy + dz * dz;
      if (dd < d1) { d2 = d1; n2 = n1; d1 = dd; n1 = j; }
      else if (dd < d2) { d2 = dd; n2 = j; }
    }
    for (const n of [n1, n2]) {
      if (n < 0 || n < i) continue;          // n < i already considered the pair
      const ph = rand(), sp = rand();
      linkPos.push(...tips[i], ...tips[n]);
      linkT.push(0, 1);
      linkInfo.push(ph, sp, ph, sp);
      links++;
    }
  }
  const linkGeometry = new THREE.BufferGeometry();
  linkGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(linkPos), 3));
  linkGeometry.setAttribute("aT", new THREE.BufferAttribute(new Float32Array(linkT), 1));
  linkGeometry.setAttribute("aInfo", new THREE.BufferAttribute(new Float32Array(linkInfo), 2));
  linkGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  const linkMaterial = new THREE.ShaderMaterial({
    name: "links",
    uniforms: shared,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aT;
      attribute vec2 aInfo;
      uniform vec3 uPointer;
      uniform float uPointerStrength;
      varying float vT, vPhase, vSpeed, vNear;
      void main() {
        vT = aT; vPhase = aInfo.x; vSpeed = aInfo.y;
        vNear = smoothstep(1.2, 0.0, distance(position, uPointer)) * uPointerStrength;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime, uForm;
      varying float vT, vPhase, vSpeed, vNear;
      void main() {
        float pulse = fract(uTime * (0.08 + vSpeed * 0.14) + vPhase);
        float g = smoothstep(0.12, 0.0, abs(vT - pulse));
        g += smoothstep(0.05, 0.0, abs(vT - fract(pulse + 0.5))) * vNear;   /* second pulse fires near the cursor */
        float a = (0.09 + g * 0.8 + vNear * 0.2) * uForm * uForm;
        vec3 c = mix(vec3(0.42, 0.38, 0.85), vec3(0.62, 0.9, 1.0), clamp(g, 0.0, 1.0));
        gl_FragColor = vec4(c * a, a);
      }
    `,
  });
  const linkLines = new THREE.LineSegments(linkGeometry, linkMaterial);

  /* ---------------- nodes: the synapse endpoints breathe ---------------- */
  const nodePos = new Float32Array(tips.length * 3);
  const nodePh = new Float32Array(tips.length);
  tips.forEach((tp, i) => { nodePos.set(tp, i * 3); nodePh[i] = rand(); });
  const nodeGeometry = new THREE.BufferGeometry();
  nodeGeometry.setAttribute("position", new THREE.BufferAttribute(nodePos, 3));
  nodeGeometry.setAttribute("aPh", new THREE.BufferAttribute(nodePh, 1));
  nodeGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);

  const nodeMaterial = new THREE.ShaderMaterial({
    name: "nodes",
    uniforms: shared,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aPh;
      uniform float uTime, uForm, uPixelRatio, uPointerStrength;
      uniform vec3 uPointer;
      varying float vGlow;
      void main() {
        float breath = 0.5 + 0.5 * sin(uTime * 1.5 + aPh * 6.2832);
        float near = smoothstep(1.1, 0.0, distance(position, uPointer)) * uPointerStrength;
        vGlow = (0.35 + 0.65 * breath + near) * uForm;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (3.4 + breath * 2.6 + near * 3.5) * uPixelRatio * (3.4 / -mv.z);
      }
    `,
    fragmentShader: /* glsl */`
      varying float vGlow;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.05, d) * vGlow * 0.8;
        if (a < 0.012) discard;
        vec3 c = mix(vec3(0.55, 0.5, 1.0), vec3(0.85, 0.97, 1.0), vGlow);
        gl_FragColor = vec4(c * a, a);
      }
    `,
  });
  const nodes = new THREE.Points(nodeGeometry, nodeMaterial);

  /* ---------------- the wood: swept tapering tubes over each branch ---------------- */
  function buildWood() {
    const pos = [], nor = [], idx = [];
    const RS = 6;                       // ring segments
    for (const br of branches) {
      const n = br.pts.length;
      const start = pos.length / 3;
      for (let i = 0; i < n; i++) {
        const p = br.pts[i];
        const a = br.pts[Math.max(0, i - 1)], b = br.pts[Math.min(n - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1], tz = b[2] - a[2];
        const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
        let ux = -ty, uy = tx, uz = 0;
        let ul = Math.hypot(ux, uy, uz);
        if (ul < 0.01) { ux = 1; uy = 0; uz = 0; ul = 1; }
        ux /= ul; uy /= ul; uz /= ul;
        const vx = ty * uz - tz * uy, vy = tz * ux - tx * uz, vz = tx * uy - ty * ux;
        const r = br.r0 * (1 - 0.78 * (i / (n - 1))) * 1.05;
        for (let k = 0; k < RS; k++) {
          const ang = (k / RS) * Math.PI * 2;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const nx = ux * ca + vx * sa, ny = uy * ca + vy * sa, nz = uz * ca + vz * sa;
          pos.push(p[0] + nx * r, p[1] + ny * r, p[2] + nz * r);
          nor.push(nx, ny, nz);
        }
        if (i > 0) {
          const A = start + (i - 1) * RS, B = start + i * RS;
          for (let k = 0; k < RS; k++) {
            const k2 = (k + 1) % RS;
            idx.push(A + k, B + k, B + k2, A + k, B + k2, A + k2);
          }
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(nor), 3));
    g.setIndex(idx);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 14);
    return g;
  }
  const woodMaterial = new THREE.ShaderMaterial({
    name: "wood",
    uniforms: { ...shared, ...palette },
    transparent: true,
    vertexShader: /* glsl */`
      uniform float uTime, uForm;
      varying vec3 vN, vP;
      varying float vH;
      void main() {
        vec3 p = position;
        /* the whole crown sways; the base stands still */
        float sway = smoothstep(-1.6, 1.3, p.y);
        p.x += sin(uTime * 0.5 + p.y * 2.1) * 0.035 * sway * uForm;
        p.z += cos(uTime * 0.4 + p.x * 1.7) * 0.028 * sway * uForm;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vN = normalize(normalMatrix * normal);
        vP = mv.xyz;
        vH = position.y;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColorB, uColorMoss;
      uniform float uForm;
      varying vec3 vN, vP;
      varying float vH;
      void main() {
        vec3 V = normalize(-vP);
        float fres = pow(1.0 - abs(dot(normalize(vN), V)), 2.5);
        vec3 rim = mix(uColorMoss, uColorB, smoothstep(-1.3, 1.3, vH));
        vec3 c = vec3(0.014, 0.014, 0.022) + rim * fres * 0.5;
        float a = uForm * uForm;
        gl_FragColor = vec4(c * a, a);
      }
    `,
  });
  const wood = new THREE.Mesh(buildWood(), woodMaterial);

  /* ---------------- moths: two glowing visitors ---------------- */
  const MOTHS = narrow ? 1 : 2;
  function makeMothGeometry() {
    const outline = [                  // one wing silhouette in the xz plane
      [0.020, -0.050], [0.062, -0.088], [0.132, -0.026],
      [0.108, 0.048], [0.040, 0.058], [0.008, 0.030],
    ];
    const pos = [], side = [], span = [], idx = [];
    for (const s of [-1, 1]) {
      const start = pos.length / 3;
      pos.push(0, 0, 0); side.push(s); span.push(0);
      for (const [wx, wz] of outline) {
        pos.push(wx * s, 0, wz); side.push(s); span.push(wx / 0.132);
      }
      for (let i = 1; i < outline.length; i++) idx.push(start, start + i, start + i + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute("aSide", new THREE.BufferAttribute(new Float32Array(side), 1));
    g.setAttribute("aSpan", new THREE.BufferAttribute(new Float32Array(span), 1));
    g.setIndex(idx);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1);
    return g;
  }
  const mothGeometry = makeMothGeometry();
  function makeMothMaterial(phase) {
    return new THREE.ShaderMaterial({
      name: "moth",
      uniforms: { uTime: shared.uTime, uForm: shared.uForm, uPhase: { value: phase }, ...palette },
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      vertexShader: /* glsl */`
        attribute float aSide, aSpan;
        uniform float uTime, uPhase;
        varying float vSpan, vFlap;
        void main() {
          float a = (sin(uTime * 11.0 + uPhase * 6.2832) * 0.95 + 0.2) * aSide;
          vFlap = abs(sin(uTime * 11.0 + uPhase * 6.2832));
          vSpan = aSpan;
          vec3 p = vec3(position.x * cos(a), position.x * sin(a), position.z);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uForm;
        uniform vec3 uColorB, uColorHot;
        varying float vSpan, vFlap;
        void main() {
          vec3 c = mix(uColorHot, uColorB, vSpan * 0.85);
          float a = (0.85 - vSpan * 0.5) * (0.55 + 0.45 * vFlap) * uForm * uForm;
          gl_FragColor = vec4(c * a, a);
        }
      `,
    });
  }
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  const moths = [];
  for (let m = 0; m < MOTHS; m++) {
    const mesh = new THREE.Mesh(mothGeometry, makeMothMaterial(rand()));
    mesh.scale.setScalar(0.6);
    const tp = tips[(rand() * tips.length) | 0];
    moths.push({
      mesh,
      pos: new THREE.Vector3(tp[0], tp[1] + 0.3, tp[2] + 0.4),
      vel: new THREE.Vector3(0.2, 0, 0),
      anchor: new THREE.Vector3().fromArray(tips[(rand() * tips.length) | 0]),
      timer: 2 + m * 3,
      phase: rand() * 6.28,
    });
  }
  function updateMoths(dt, t) {
    for (const mo of moths) {
      mo.timer -= dt;
      if (mo.timer <= 0) {                      /* pick the next perch to orbit */
        mo.anchor.fromArray(tips[(rand() * tips.length) | 0]);
        mo.timer = 4 + rand() * 5;
      }
      tmpA.copy(mo.anchor);
      tmpA.x += Math.sin(t * 0.9 + mo.phase) * 0.35;
      tmpA.y += Math.cos(t * 0.7 + mo.phase * 2.0) * 0.25 + 0.15;
      tmpA.z += Math.sin(t * 0.6 + mo.phase * 3.0) * 0.3;
      if (shared.uPointerStrength.value > 0.55) tmpA.lerp(shared.uPointer.value, 0.4);
      tmpB.subVectors(tmpA, mo.pos).multiplyScalar(1.4);
      mo.vel.addScaledVector(tmpB, dt).clampLength(0, 0.6);
      mo.pos.addScaledVector(mo.vel, dt);
      mo.mesh.position.copy(mo.pos);
      if (mo.vel.lengthSq() > 1e-6)
        mo.mesh.quaternion.setFromUnitVectors(tmpA.set(0, 0, 1), tmpB.copy(mo.vel).normalize());
    }
  }
  const mothMeshes = moths.map((m) => m.mesh);

  /* one transform for the whole organism */
  const organism = new THREE.Group();
  organism.add(wood, points, linkLines, nodes, ...mothMeshes);
  wood.renderOrder = 0; points.renderOrder = 1; linkLines.renderOrder = 2; nodes.renderOrder = 3;
  mothMeshes.forEach((m) => { m.renderOrder = 4; });
  organism.rotation.set(0.06, -0.25, 0.0);
  organism.scale.setScalar(0.7);
  scene.add(organism);

  function layout() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    organism.position.x = w > 960 ? 0.05 : w > 720 ? 0 : -0.05;
    organism.position.y = w > 720 ? -0.12 : -0.3;
    organism.scale.setScalar(w > 720 ? 0.7 : 0.58);
  }
  layout();
  addEventListener("resize", layout);

  /* pointer → world plane at z 0 → organism space */
  const ndc = new THREE.Vector2(9, 9);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const ray = new THREE.Raycaster();
  const hit = new THREE.Vector3();
  const target = new THREE.Vector3(99, 99, 0);
  let targetStrength = 0;
  addEventListener("pointermove", (e) => {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    targetStrength = 1;
  });
  addEventListener("pointerleave", () => { targetStrength = 0; });
  /* resolved every frame with the CURRENT camera — resolving only on
     pointermove leaves the repel bubble trailing while the parallax
     camera keeps drifting */
  function resolvePointer() {
    if (ndc.x === 9) return;
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) {
      organism.updateMatrixWorld();
      target.copy(organism.worldToLocal(hit));
    }
  }

  /* telemetry — the numbers in the footer are the scene's real numbers */
  const telemetry = document.getElementById("telemetry");
  let fps = 60, lastTelemetry = 0;

  const clock = new THREE.Clock();
  let formT = reducedMotion ? 1 : 0;
  let raf = 0;

  function frame() {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    shared.uTime.value = clock.elapsedTime;

    if (formT < 1) {
      formT = Math.min(1, formT + dt / 2.6);
      shared.uForm.value = 1 - Math.pow(1 - formT, 3);
    }

    camera.position.x += (ndc.x === 9 ? 0 : ndc.x * 0.1 - camera.position.x) * 0.03;
    camera.position.y += (ndc.y === 9 ? 0 : ndc.y * 0.06 - camera.position.y) * 0.03;
    camera.lookAt(0.55, 0, 0);

    resolvePointer();
    shared.uPointer.value.lerp(target, 1 - Math.pow(0.0002, dt));
    shared.uPointerStrength.value += (targetStrength * 0.9 + 0.1 - shared.uPointerStrength.value) * (1 - Math.pow(0.002, dt));

    updateMoths(dt, clock.elapsedTime);
    renderer.render(scene, camera);

    if (dt > 0) fps += (1 / dt - fps) * 0.06;
    if (clock.elapsedTime - lastTelemetry > 0.5) {
      lastTelemetry = clock.elapsedTime;
      telemetry.textContent = `${COUNT.toLocaleString("en-US")} points · ${links} synapses · ${MOTHS} moths · ${Math.round(fps)} fps`;
    }
  }

  document.body.classList.add("gl-ready");
  window.__atlas = { shared, organism, moths, warp() { formT = 1; shared.uForm.value = 1; }, get formT() { return formT; }, get fps() { return fps; } };
  addEventListener("error", (e) => { (window.__atlasErrors ??= []).push(String(e.message)); });

  if (reducedMotion) {
    shared.uForm.value = 1;
    shared.uTime.value = 40;
    renderer.render(scene, camera);
    telemetry.textContent = `${COUNT.toLocaleString("en-US")} points · ${links} synapses · ${MOTHS} moths · still`;
    return;
  }

  frame();
  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(raf);
    /* the dt clamp in frame() swallows the gap; restarting the clock
       would rewind uTime and make the whole field jump */
    if (!document.hidden) frame();
  });
}

start();
</script>
</body>
</html>
